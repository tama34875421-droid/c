return `<div class="hero"><div><div class="eyebrow">SELAMAT DATANG DI COBAIN</div><h1>Hai ${esc((state.profile.name||'Siswa').split(' ')[0])}, ayo coba pekerjaan yang sesungguhnya.</h1><p>Kenali profesinya, pelajari brief, kerjakan proyek, terima masukan, revisi, lalu refleksikan pengalamanmu. Bukan sekadar menjawab soal.</p><button class="btn btn-orange" onclick="navigate('explore')">Mulai eksplorasi profesi <span>→</span></button></div><div class="hero-art"><div class="art-card"><div class="art-circle">✦</div><strong>Belajar lewat pengalaman</strong><p>Hasil kerja mini · AI Mentor demo · Career Passport</p><div class="progress-track" style="margin-top:14px;background:#ffffff35"><span style="width:65%;background:#ffbd4a"></span></div></div></div></div>
<div class="stats"><div class="stat"><div class="label">Profesi tersedia</div><strong>06</strong><div class="note">Jalur eksplorasi awal</div></div><div class="stat"><div class="label">Trial dimulai</div><strong>${started}</strong><div class="note">Tersimpan di browser ini</div></div><div class="stat"><div class="label">Trial selesai</div><strong>${completed}</strong><div class="note">Bukan sertifikasi kompetensi</div></div><div class="stat"><div class="label">COBAIN Points</div><strong>${state.points.toLocaleString('id-ID')}</strong><div class="note">Saldo simulasi lokal</div></div></div>
<div class="section-head"><div><h2>Progres yang bisa dilanjutkan</h2><p>Setiap trial terdiri dari 7 tahap pekerjaan.</p></div></div>${continueBlock}
<div class="section-head"><div><h2>Temukan profesi yang menarik buatmu</h2><p>Pilih berdasarkan rasa ingin tahu, bukan karena skor menentukan masa depan.</p></div><button class="btn btn-plain" onclick="navigate('explore')">Lihat semua profesi →</button></div><div class="grid grid-3">${CAREERS.slice(0,3).map(careerCard).join('')}</div>
<div class="section-head"><div><h2>Bagaimana COBAIN bekerja?</h2><p>Alur pembelajaran yang sama, tetapi aktivitas berbeda untuk setiap profesi.</p></div></div><div class="grid grid-4">${[['📖','Kenali profesi','Pahami peran, aktivitas, alat, dan sumber.'],['🧰','Kerjakan proyek','Buat hasil kerja di Workbench khusus.'],['🔁','Terima & revisi','Hadapi perubahan dan perbaiki pekerjaan.'],['◇','Refleksi','Simpan hasil dan pengalaman di Career Passport.']].map(x=>`<div class="card pad"><div style="font-size:25px;margin-bottom:10px">${x[0]}</div><h3 class="card-title">${x[1]}</h3><p class="small muted">${x[2]}</p></div>`).join('')}</div>${footer()}`}
function renderExplore(){return `<div class="eyebrow">CAREER EXPLORER</div><h1 class="h1">Jelajahi profesi</h1><p class="subtitle">Setiap kartu membuka pengenalan lengkap, referensi sumber, skenario proyek, dan tahapan untuk mencoba pekerjaan.</p><div class="library-filter"><input id="careerSearch" placeholder="Cari profesi atau aktivitas kerja…" oninput="renderCareerGrid(this.value)"><select id="careerDifficulty" onchange="renderCareerGrid(document.getElementById('careerSearch').value)"><option value="all">Semua tingkat</option><option value="beginner">Pemula</option></select><select id="careerSort" onchange="renderCareerGrid(document.getElementById('careerSearch').value)"><option value="default">Urutan rekomendasi</option><option value="cost">Points paling rendah</option><option value="time">Durasi paling singkat</option></select></div><div id="careerGrid" class="grid grid-3">${CAREERS.map(careerCard).join('')}</div><div class="callout blue" style="margin-top:17px">Catatan: deskripsi profesi disusun dari referensi publik dan perlu validasi profesional sebelum dijadikan versi produksi. Kasus, kutipan pengguna, dan dataset dalam trial adalah sintetis.</div>${footer()}`}
function renderCareerGrid(q=''){const grid=document.getElementById('careerGrid');if(!grid)return;let list=[...CAREERS];q=(q||'').toLowerCase();list=list.filter(c=>(c.title+' '+c.display_role+' '+CAREER_META[c.id].summary).toLowerCase().includes(q));const sort=document.getElementById('careerSort')?.value||'default';if(sort==='cost')list.sort((a,b)=>a.cost_points-b.cost_points);if(sort==='time')list.sort((a,b)=>parseInt(a.duration)-parseInt(b.duration));grid.innerHTML=list.length?list.map(careerCard).join(''):'<div class="card empty">Tidak ada profesi yang cocok dengan pencarianmu.</div>'}
function renderCareerDetail(){const c=getCareer(),m=getMeta();const p=progress(c);const t=getTrial();const action=t&&!t.complete?`<button class="btn btn-primary" onclick="continueTrial('${c.id}')">Lanjutkan Career Trial →</button>`:t?.complete?`<button class="btn btn-primary" onclick="navigate('results');currentCareer='${c.id}';render()">Lihat hasil trial →</button><button class="btn btn-plain" onclick="restartTrialPrompt('${c.id}')">Ulangi trial</button>`:`<button class="btn btn-primary" onclick="startTrial('${c.id}')">Mulai Career Trial · ${c.cost_points} pts →</button>`;
let tabContent='';if(careerTab==='overview')tabContent=`<div class="split"><div class="card pad info-block"><h3>Apa itu ${esc(c.title)}?</h3><p>${esc(m.about)}</p><div class="divider"></div><h3>Tanggung jawab yang umum</h3><ul class="bullet-list">${m.responsibilities.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><div class="divider"></div><h3>Seperti apa hari kerjanya?</h3><ul class="bullet-list">${m.day.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><div class="divider"></div><h3>Tools yang mungkin digunakan</h3><div class="row" style="flex-wrap:wrap">${m.tools.map(x=>`<span class="badge">${esc(x)}</span>`).join('')}</div><div class="divider"></div><h3>Contoh hasil kerja</h3><ul class="bullet-list">${m.outputs.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div><div class="grid"><div class="card pad info-block"><h3>Skill yang berguna</h3><ul class="bullet-list">${m.skills.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div><div class="card pad info-block"><h3>Hal yang sering disalahpahami</h3><ul class="bullet-list">${m.myths.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div><div class="card pad"><h3 class="card-title">Tujuan trial ini</h3><p class="small muted">${esc(c.purpose)}</p><div class="divider"></div><div class="row between"><span class="tiny muted">Durasi</span><strong>${esc(c.duration)}</strong></div><div class="row between" style="margin-top:8px"><span class="tiny muted">Biaya simulasi</span><strong>${c.cost_points} points</strong></div><div class="row between" style="margin-top:8px"><span class="tiny muted">Tingkat</span><strong>${esc(c.difficulty.split('/')[0])}</strong></div></div></div></div>`;
if(careerTab==='process')tabContent=`<div class="card pad"><h3 class="card-title">Alur kerja dalam trial</h3><p class="small muted">Urutan ini adalah desain pembelajaran COBAIN yang diinformasikan oleh referensi pekerjaan; bukan klaim bahwa setiap perusahaan menggunakan urutan identik.</p><div style="margin-top:15px">${c.stages.map((s,i)=>`<div class="row" style="gap:12px;margin:0 0 14px"><div class="step-num" style="width:31px;height:31px">${i+1}</div><div style="flex:1"><div class="row between"><strong style="font-size:12px;color:var(--navy)">${esc(s.name)}</strong><span class="badge">${esc(s.time)}</span></div><p class="small muted" style="margin:4px 0">${esc(s.action)}</p><div class="tiny" style="color:#3173c9">Bukti hasil: ${esc(s.evidence)}</div></div></div>`).join('')}</div></div>`;
if(careerTab==='outputs')tabContent=`<div class="grid grid-2"><div class="card pad"><h3 class="card-title">Deliverables yang akan kamu hasilkan</h3><p class="small muted">Bukan hanya menjawab soal—kamu diminta membuat artefak sederhana dari pekerjaan.</p><ul class="bullet-list">${m.deliverables.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div><div class="card pad"><h3 class="card-title">Rubrik review awal</h3><p class="small muted">Review demo merujuk pada rubrik berikut, lalu menampilkan bukti yang ada di jawabanmu.</p><table class="rubric-small"><thead><tr><th>Kriteria</th><th>Bobot</th></tr></thead><tbody>${c.rubric.map(r=>`<tr><td>${esc(r[0])}</td><td>${r[1]}%</td></tr>`).join('')}</tbody></table><div class="callout" style="margin-top:12px">Skor adalah feedback artefak dalam skenario demo—bukan tes bakat, prediksi karier, atau sertifikasi kompetensi.</div></div></div>`;
if(careerTab==='resources')tabContent=`<div class="card pad"><h3 class="card-title">Baca sebelum atau sesudah trial</h3><p class="small muted">Sumber eksternal membantu kamu mengenal profesi dan melihat asal-usul rancangan simulasi. Sebagian sumber bersifat lintas negara atau berdekatan dengan profesi terkait; baca konteks dan keterbatasannya.</p>${sourceCards(m.sources)}</div>`;
return `<div style="margin-bottom:14px"><button class="btn btn-plain" onclick="navigate('explore')">← Kembali ke profesi</button></div><div class="detail-hero"><div><div class="row" style="gap:7px;flex-wrap:wrap"><span class="badge">${esc(c.display_role)}</span><span class="badge">${esc(c.duration)}</span><span class="badge">Level pemula</span></div><h1 class="h1">${esc(c.title)}</h1><p>${esc(m.summary)}</p><div class="row" style="flex-wrap:wrap"><span class="small">🧰 Proyek berbasis aktivitas kerja</span><span class="small">📚 Referensi bisa dibuka</span><span class="small">🪙 ${c.cost_points} points (demo)</span></div></div><div class="row" style="align-items:center;flex-direction:column;justify-content:center;min-width:150px"><div class="role-icon">${m.icon}</div>${action}</div></div><div class="tabbar"><button class="${careerTab==='overview'?'active':''}" onclick="careerTab='overview';render()">Pengenalan profesi</button><button class="${careerTab==='process'?'active':''}" onclick="careerTab='process';render()">Alur kerja</button><button class="${careerTab==='outputs'?'active':''}" onclick="careerTab='outputs';render()">Hasil & rubrik</button><button class="${careerTab==='resources'?'active':''}" onclick="careerTab='resources';render()">Referensi</button></div>${tabContent}<div class="card pad" style="margin-top:16px"><div class="row between"><div><h3 class="card-title">${p.done?'Trial sudah selesai':p.pct?'Kamu sudah memulai trial ini':'Siap mencoba pekerjaan ini?'}</h3><p class="small muted" style="margin:4px 0 0">${p.done?'Buka hasil dan refleksimu, atau ulangi trial.':p.pct?'Progres: '+p.pct+'% — jawaban yang tersimpan akan digunakan saat melanjutkan.':'Kamu akan mengikuti 7 tahap sampai refleksi dan review akhir.'}</p></div>${action}</div></div>${footer()}`}
function sourceCards(ids){return `<div class="source-list" style="margin-top:12px">${ids.map(id=>{const s=SOURCES[id];if(!s)return '';return `<div class="source-card"><div class="row between" style="align-items:flex-start"><div><h4>${esc(s.title)}</h4><p>${esc(s.publisher)} · ${esc(s.kind)}</p><p>${esc(s.why)}</p><a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">Buka sumber asli ↗</a></div><span class="badge">${esc(id)}</span></div></div>`}).join('')}</div>`}
function renderTrial(){const c=getCareer(),m=getMeta(),t=ensureTrial(),idx=Math.max(0,Math.min(6,t.stage||0)),stage=c.stages[idx];const done=t.completedStages||[];let max=0;while(done.includes(max)&&max<6)max++;let nav=STAGES.map((s,i)=>`<button class="step-button ${idx===i?'active':''} ${done.includes(i)?'done':''}" ${i<=max||done.includes(i)?`onclick="goStage(${i})"`:'disabled title="Selesaikan tahap sebelumnya dulu"'}><span class="step-num">${done.includes(i)?'✓':i+1}</span><span class="step-text"><strong>${s[0]}</strong><small>${s[1]}</small></span></button>`).join('');let body='';if(idx===0)body=renderIntroStage(c,m,t);if(idx===1)body=renderBriefStage(c,m,t);if(idx===2)body=renderWorkbenchStage(c,m,t);if(idx===3)body=renderClientStage(c,m,t);if(idx===4)body=renderRevisionStage(c,m,t);if(idx===5)body=renderReviewStage(c,m,t);if(idx===6)body=renderReflectionStage(c,m,t);
return `<div class="trial-top"><div><div class="eyebrow">CAREER TRIAL · ${esc(c.title.toUpperCase())}</div><h1 class="h1" style="margin-bottom:5px">${esc(m.briefTitle)}</h1><p class="subtitle">${esc(c.display_role)} · ${esc(c.duration)} · Skenario perusahaan fiktif</p></div><div class="row"><button class="btn btn-plain" onclick="saveNow()">▣ Simpan draft</button><button class="btn btn-plain" onclick="navigate('career')">Keluar ke detail</button></div></div><div class="grid" style="grid-template-columns:minmax(0,1fr);gap:8px;margin-bottom:15px"><div class="row between"><span class="tiny muted">Progres trial</span><strong class="tiny">${done.length}/7 tahap</strong></div><div class="progress-track"><span style="width:${done.length/7*100}%"></span></div></div><div class="trial-shell"><aside class="card step-nav"><h3>LANGKAH PROYEK</h3><div class="steps-scroll">${nav}</div><div class="divider"></div><div class="tiny muted">Hasil disimpan otomatis di browser saat kamu mengetik. Gunakan “Simpan draft” sebelum menutup halaman.</div><div style="margin-top:10px"><button class="btn btn-plain" style="width:100%" onclick="navigate('library')">📚 Buka perpustakaan</button></div></aside><section class="card trial-content">${body}</section>${renderMentorPanel(t,c,m)}</div>${footer()}`}
function renderIntroStage(c,m,t){return `<div class="step-kicker">TAHAP 1 · PENGENALAN PROFESI</div><h1>Kenali pekerjaan ${esc(c.title)}</h1><p class="lead">Sebelum mulai mengerjakan proyek, pahami dulu apa pekerjaan ini, untuk apa perannya ada, apa yang dikerjakan, dan hasil apa yang biasanya dibuat.</p><div class="reading-card"><h3>Apa itu ${esc(c.title)}?</h3><p>${esc(m.about)}</p></div><div class="grid grid-2"><div class="reading-card"><h3>Tanggung jawab utama</h3><ul>${m.responsibilities.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div><div class="reading-card"><h3>Gambaran satu hari kerja</h3><ul>${m.day.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div><div class="reading-card"><h3>Tools yang mungkin digunakan</h3><ul>${m.tools.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div><div class="reading-card"><h3>Hasil kerja yang bisa dilihat</h3><ul>${m.outputs.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div></div><div class="reading-card"><h3>Keterampilan yang dipakai</h3><div class="row" style="flex-wrap:wrap">${m.skills.map(x=>`<span class="badge badge-blue">${esc(x)}</span>`).join('')}</div></div><div class="reading-card"><h3>Hal yang tidak boleh dilupakan</h3><ul>${m.myths.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div><div class="callout blue"><strong>Dari mana materi ini berasal?</strong><br>Pengantar ini dirangkum dari referensi standar/organisasi profesi, lembaga pembelajaran, dan sumber praktik publik yang tercantum di bawah. Beberapa sumber berdekatan dengan profesi yang dibahas, bukan standar jabatan yang persis sama. Konten ini masih desk research dan belum divalidasi melalui wawancara tim COBAIN.</div><div class="section-head"><div><h2>Referensi pengenalan profesi</h2><p>Buka sumber asli bila ingin membaca lebih lanjut.</p></div><button class="btn btn-plain" onclick="careerTab='resources';navigate('career')">Lihat semua referensi ↗</button></div>${sourceCards(m.sources.slice(0,4))}<div class="check-line"><input type="checkbox" id="introRead" ${answer('introRead')?'checked':''} data-answer="introRead"><label for="introRead">Aku sudah membaca pengenalan ini dan memahami bahwa trial adalah simulasi, bukan gambaran persis semua perusahaan.</label></div><div class="work-actions"><span class="stage-footnote">Perkiraan waktu membaca: 5 menit</span><button class="btn btn-primary" onclick="completeStage(0,'introRead')">Selesai mengenal profesi →</button></div>`}
function renderBriefStage(c,m,t){return `<div class="step-kicker">TAHAP 2 · MEMAHAMI BRIEF</div><h1>${esc(c.stages[1].name)}</h1><p class="lead">Baca kebutuhan pihak yang meminta pekerjaan, pahami batasan, lalu lihat bahan yang diberikan sebelum mengambil keputusan.</p><div class="reading-card"><div class="row between" style="align-items:flex-start"><div><span class="badge badge-orange">KASUS FIKTIF</span><h3 style="margin-top:8px">${esc(m.briefTitle)}</h3></div><span class="badge">Brief klien</span></div><p>${esc(c.scenario)}</p></div><div class="grid grid-2"><div class="reading-card"><h3>Tujuan dan kebutuhan</h3><ul>${c.inputs.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div><div class="reading-card"><h3>Output yang diminta</h3><ul>${m.deliverables.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div></div>${renderMaterials(c.id)}<div class="callout"><strong>Kerangka keputusan:</strong> identifikasi tujuan, bukti yang tersedia, batasan yang berlaku, hasil yang diminta, dan informasi yang masih belum diketahui. Semua data bisnis/pengguna di kasus ini adalah sintetis.</div><div class="check-line"><input type="checkbox" id="briefRead" ${answer('briefRead')?'checked':''} data-answer="briefRead"><label for="briefRead">Aku sudah memahami tujuan brief, bahan kerja, batasan dan hasil yang harus kubuat.</label></div><div class="work-actions"><button class="btn btn-plain" onclick="goStage(0)">← Tahap sebelumnya</button><button class="btn btn-primary" onclick="completeStage(1,'briefRead')">Mulai mengerjakan proyek →</button></div>`}
function renderMaterials(id){if(id==='marketing')return `<div class="reading-card"><h3>Bahan A — ringkasan survei pelanggan (data sintetis)</h3><table class="data-table"><thead><tr><th>Temuan contoh</th><th>Persentase responden</th><th>Catatan</th></tr></thead><tbody><tr><td>Ingin minuman praktis dibawa</td><td>62%</td><td>Survei kecil fiktif</td></tr><tr><td>Memperhatikan harga</td><td>54%</td><td>Tak mewakili pasar luas</td></tr><tr><td>Melihat review sebelum mencoba</td><td>41%</td><td>Jawaban bisa tumpang tindih</td></tr></tbody></table><h3 style="margin-top:15px">Bahan B — pesaing fiktif</h3><ul><li>FreshGo: harga rendah, komunikasi promosi harga.</li><li>DailySip: pesan praktis dan mudah dibawa.</li><li>FruitLab: menonjolkan variasi rasa.</li></ul></div>`;if(id==='ux')return `<div class="reading-card"><h3>Bukti pengguna sintetis</h3><ul><li>“Saya tidak tahu apakah pendaftaran saya berhasil.”</li><li>“Form panjang membuat saya ingin menyerah di tengah jalan.”</li><li>“Saya mencari jadwal dan lokasi sebelum mendaftar.”</li><li>“Kalau jaringan lambat, saya takut menekan tombol dua kali.”</li></ul><p style="margin-top:9px">Tugasmu: bedakan kutipan (bukti) dari interpretasi (penjelasan yang kamu ajukan).</p></div>`;if(id==='data')return `<div class="reading-card"><h3>Preview data penjualan sintetis</h3><p>Gunakan tabel di Workbench untuk memfilter kategori dan mengurutkan nilai. Jangan langsung menyatakan penyebab penjualan turun tanpa data tambahan.</p>${dataTablePreview()}</div>`;if(id==='content')return `<div class="reading-card"><h3>Brief konten</h3><ul><li>Format: video vertikal 30–45 detik.</li><li>Audiens: pelajar/mahasiswa yang membawa bekal.</li><li>Tujuan: memperkenalkan produk kotak makan pakai ulang.</li><li>Batasan: hindari klaim ramah lingkungan yang tidak punya bukti.</li><li>Hasil: hook, skrip, storyboard, caption, CTA.</li></ul></div>`;if(id==='software')return `<div class="reading-card"><h3>Requirement / acceptance criteria</h3><ul><li>Email kosong harus ditolak.</li><li>Format email yang tidak masuk akal harus menghasilkan pesan error yang jelas.</li><li>Email valid boleh melanjutkan simulasi.</li><li>Tombol/field memiliki label yang jelas dan bisa dioperasikan dengan keyboard.</li></ul><p class="tiny muted">Kode akan diedit sebagai teks. Runner di sini memeriksa pola kode sederhana—bukan menjalankan program secara terisolasi.</p></div>`;return `<div class="reading-card"><h3>Dataset preferensi belajar anonim (sintetis)</h3><table class="data-table"><thead><tr><th>Metode belajar</th><th>Jumlah pilihan</th><th>Jumlah responden</th></tr></thead><tbody><tr><td>Contoh visual</td><td>8</td><td>20</td></tr><tr><td>Latihan langsung</td><td>7</td><td>20</td></tr><tr><td>Membaca ringkasan</td><td>3</td><td>20</td></tr><tr><td>Diskusi berpasangan</td><td>2</td><td>20</td></tr></tbody></table><p>Data ini tidak punya nama, diagnosis, atau cerita pribadi. Tidak boleh digunakan untuk memberi label pada siswa.</p></div>`}
const DATA_ROWS=[['Buku tulis', 'Minggu 1',128,34,2720000,2],['Pulpen', 'Minggu 1',160,55,1100000,4],['Map plastik', 'Minggu 1',94,21,630000,3],['Buku tulis', 'Minggu 2',140,37,2960000,2],['Pulpen', 'Minggu 2',177,53,1060000,7],['Map plastik', 'Minggu 2',101,24,720000,2],['Buku tulis', 'Minggu 3',152,35,2800000,4],['Pulpen', 'Minggu 3',182,48,960000,8],['Map plastik', 'Minggu 3',98,19,570000,5],['Buku tulis', 'Minggu 4',136,32,2560000,3],['Pulpen', 'Minggu 4',190,46,920000,9],['Map plastik', 'Minggu 4',111,21,630000,5]];
function dataTablePreview(){return `<div class="table-wrap"><table class="data-table"><thead><tr><th>Produk</th><th>Minggu</th><th>Unit</th><th>Pesanan</th><th>Pendapatan</th><th>Retur</th></tr></thead><tbody>${DATA_ROWS.slice(0,5).map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td><td>${money(r[4])}</td><td>${r[5]}</td></tr>`).join('')}</tbody></table></div><p class="tiny muted">5 dari 12 baris ditampilkan; data lengkap tersedia di Workbench. Seluruhnya adalah data buatan untuk latihan.</p>`}
function field(name,label,placeholder='',full=false,hint=''){return `<div class="field ${full?'full':''}"><label for="f_${name}">${label}${hint?` <span class="hint">· ${hint}</span>`:''}</label><textarea id="f_${name}" data-answer="${name}" placeholder="${esc(placeholder)}">${esc(answer(name))}</textarea></div>`}
function inputField(name,label,placeholder='',type='text',hint=''){return `<div class="field"><label for="f_${name}">${label}${hint?` <span class="hint">· ${hint}</span>`:''}</label><input id="f_${name}" type="${type}" data-answer="${name}" value="${esc(answer(name))}" placeholder="${esc(placeholder)}"></div>`}
function selectField(name,label,options,hint=''){return `<div class="field"><label for="f_${name}">${label}${hint?` <span class="hint">· ${hint}</span>`:''}</label><select id="f_${name}" data-answer="${name}"><option value="">Pilih opsi…</option>${options.map(x=>`<option ${answer(name)===x?'selected':''}>${esc(x)}</option>`).join('')}</select></div>`}
function renderWorkbenchStage(c,m,t){let work='';if(c.id==='marketing')work=`<div class="reading-card"><h3>Campaign Canvas — SegarKita</h3><p>Tentukan arah kampanye. Gunakan data survei sebagai petunjuk terbatas, bukan kepastian tentang semua pelanggan.</p></div><div class="form-grid">${field('audience','1. Target audiens utama','Contoh: siswa/mahasiswa yang ingin minuman praktis dan memperhatikan harga…')}${field('insight','2. Insight berbasis bukti','Sebutkan temuan dari survei dan mengapa temuan itu relevan…')}${selectField('objective','3. Tujuan kampanye',['Meningkatkan awareness','Mendorong kunjungan ke halaman produk','Mendorong trial/pembelian pertama','Membangun interaksi yang berkualitas'])}${field('message','4. Pesan utama / value proposition','Satu kalimat yang ingin diingat audiens…')}${selectField('channels','5. Kanal utama',['Instagram Reels','TikTok','Instagram Reels + TikTok','Konten komunitas/sekolah','Konten organik + promosi berbayar'],'Pilih kanal dengan alasan, bukan ikut tren')}${inputField('budget','6. Total anggaran (Rp)','3000000','number','Batas awal Rp3.000.000')}${field('ideas','7. Ide konten dan kalender dua minggu','Ide 1 + format + jadwal + CTA; Ide 2…',true)}${field('kpi','8. KPI dan alasan memilihnya','Contoh: reach untuk awareness; CTR atau klik bila tujuan kunjungan…',true)}${field('marketingReason','Alasan menolak opsi lain','Kanal/pesan apa yang tidak dipilih dan alasannya?',true)}</div><div class="callout" id="budgetAlert" style="margin-top:12px">Batas anggaran awal: Rp3.000.000. Setelah tahap masukan klien, batas akan berubah menjadi Rp2.400.000.</div>`;
if(c.id==='ux')work=`<div class="reading-card"><h3>UX Workbench — EventKita</h3><p>Susun masalah, alur, dan isi utama layar. Wireframe di bawah adalah preview sederhana yang menampilkan teks dari draft-mu.</p></div><div class="form-grid">${field('uxProblem','1. Problem statement','Pengguna [siapa] kesulitan [apa] saat [kapan], karena…',true)}${field('uxInsights','2. Tiga insight dari kutipan','Insight 1 + kutipan bukti; insight 2 + bukti…',true)}${field('uxFlow','3. User flow pendaftaran','Contoh: Beranda → Detail workshop → Isi form → Konfirmasi…',true)}${field('screenDetail','4. Layar Detail Event — isi yang penting','Judul event, jadwal, lokasi, biaya, tombol daftar…')}${field('screenForm','5. Layar Formulir — field dan urutan','Nama (jika diperlukan), email, kebutuhan khusus (opsional)…')}${field('screenConfirm','6. Layar Konfirmasi — informasi status','Status berhasil, ringkasan pendaftaran, langkah selanjutnya…')}${field('errorMessage','7. Pesan error yang membantu','Contoh: Email belum sesuai format. Periksa kembali alamat email…',true)}</div><div class="section-head"><div><h2>Preview wireframe</h2><p>Pratinjau tekstual yang bisa kamu ubah melalui field di atas.</p></div></div><div class="wireframe-grid"><div class="wireframe"><div class="wtitle">01 · DETAIL EVENT</div><div class="bar" style="width:45%"></div><div class="bar" style="width:82%"></div><div class="mini-screen">${esc(answer('screenDetail')||'Judul, tanggal, lokasi, info singkat…')}</div><button>Daftar workshop</button></div><div class="wireframe"><div class="wtitle">02 · FORM PENDAFTARAN</div><div class="mini-screen">${esc(answer('screenForm')||'Field yang diperlukan…')}</div><input placeholder="Contoh field email" disabled><button>Kirim pendaftaran</button><div class="mini-screen" style="color:#ba5e20">${esc(answer('errorMessage')||'Pesan error ditampilkan dekat field')}</div></div><div class="wireframe"><div class="wtitle">03 · KONFIRMASI</div><div class="bar" style="width:50%;background:#c8efd8"></div><div class="mini-screen">${esc(answer('screenConfirm')||'Status, ringkasan, langkah berikutnya…')}</div><button>Lihat detail pendaftaran</button></div></div><div class="check-line"><input data-answer="uxAccessLabel" id="uxAccessLabel" type="checkbox" ${answer('uxAccessLabel')?'checked':''}><label for="uxAccessLabel">Label tombol jelas dan mudah dipahami</label></div><div class="check-line"><input data-answer="uxAccessError" id="uxAccessError" type="checkbox" ${answer('uxAccessError')?'checked':''}><label for="uxAccessError">Pesan error menjelaskan apa yang perlu diperbaiki</label></div><div class="check-line"><input data-answer="uxAccessMobile" id="uxAccessMobile" type="checkbox" ${answer('uxAccessMobile')?'checked':''}><label for="uxAccessMobile">Tata letak mempertimbangkan layar ponsel dan koneksi yang lambat</label></div>`;
if(c.id==='data')work=`<div class="reading-card"><h3>Data Workbench — KertasKita</h3><p>Pertanyaan bisnis: “Perubahan apa yang terlihat pada penjualan mingguan, dan apa yang belum dapat kita simpulkan?” Data ini sintetis, hanya untuk latihan, dan bukan data bisnis sungguhan.</p></div><div class="table-tools"><div><strong class="small">Dataset penjualan</strong><div class="tiny muted">12 baris sintetis · tidak mewakili toko nyata</div></div><select id="dataFilter" onchange="renderDataTable()"><option value="all">Semua produk</option><option>Buku tulis</option><option>Pulpen</option><option>Map plastik</option></select><button class="btn btn-plain" onclick="toggleDataSort()">↕ Urutkan pendapatan</button></div><div id="fullDataTable">${renderDataTableHtml('all',false)}</div><div class="grid grid-2" style="margin-top:12px"><div class="stat"><div class="label">Total pendapatan (seluruh sample)</div><strong>${money(DATA_ROWS.reduce((a,r)=>a+r[4],0))}</strong><div class="note">Sampel sintetis</div></div><div class="stat"><div class="label">Total unit (seluruh sample)</div><strong>${DATA_ROWS.reduce((a,r)=>a+r[2],0)}</strong><div class="note">Jumlah unit dari tabel contoh</div></div></div><div class="form-grid" style="margin-top:15px">${field('dataQuestion','1. Pertanyaan analisis','Tuliskan pertanyaan bisnis yang spesifik…',true)}${field('dataQuality','2. Pemeriksaan kualitas data','Apakah ada nilai kosong, duplikat, sampel terbatas, atau variabel yang tidak tersedia?',true)}${field('dataFinding','3. Temuan berbasis tabel','Bandingkan perubahan angka, sebutkan nilai/produk/minggu yang mendukung…',true)}${field('dataRecommendation','4. Rekomendasi langkah berikutnya','Apa tindakan awal yang proporsional dengan data ini?',true)}${field('dataLimitations','5. Batas analisis','Data apa yang dibutuhkan untuk menyimpulkan penyebab? Mengapa korelasi tidak membuktikan sebab?',true)}</div>`;
if(c.id==='content')work=`<div class="reading-card"><h3>Content Studio — BawaUlang</h3><p>Brief: buat konsep video vertikal 30–45 detik untuk mengenalkan kotak makan pakai ulang. Buat pesan menarik, tetapi jangan membuat klaim lingkungan yang tidak didukung bukti.</p></div><div class="form-grid">${field('contentAudience','1. Audiens utama','Siapa yang ingin kamu ajak menonton dan mengapa?')}${selectField('contentGoal','2. Tujuan konten',['Mengenalkan produk','Mengajari cara penggunaan','Mendorong kunjungan produk','Mendorong diskusi/komentar'])}${field('contentHook','3. Hook 3 detik pertama','Kalimat atau situasi pembuka yang membuat audiens penasaran…',true)}${field('contentScript','4. Skrip video','Tulis narasi/dialog awal, isi, dan penutup…',true)}</div><div class="section-head"><div><h2>Storyboard lima shot</h2><p>Setiap shot perlu memperjelas alur cerita, bukan sekadar mengisi durasi.</p></div></div>${[1,2,3,4,5].map(i=>`<div class="shot-card"><div class="shot-number">${i}</div><div class="field"><label>Shot ${i} — visual dan audio</label><textarea data-answer="shot${i}" placeholder="Visual, teks layar, narasi/suara…">${esc(answer('shot'+i))}</textarea></div></div>`).join('')}<div class="form-grid" style="margin-top:13px">${field('contentCaption','5. Caption','Caption yang menjelaskan manfaat tanpa klaim berlebihan…',true)}${field('contentCTA','6. Call to action (CTA)','Apa tindakan selanjutnya yang kamu sarankan?',true)}</div>`;
if(c.id==='software')work=`<div class="reading-card"><h3>Code Workbench — EventKita</h3><p>Bug: validasi email belum lengkap dan pesan error belum membantu. Editor ini tidak mengeksekusi kode; tombol tes memeriksa pola tertentu pada teks kode dan menampilkan hasil simulasi yang jelas.</p></div><div class="form-grid">${field('codeRequirement','1. Acceptance criteria','Tuliskan kondisi yang harus terpenuhi saat form digunakan…',true)}${field('bugAnalysis','2. Analisis bug','Bagian mana yang gagal dan bagaimana kamu mengetahuinya?',true)}</div><div class="field" style="margin-top:13px"><label for="f_codeEditor">3. Editor kode (JavaScript) <span class="hint">· kode disimpan sebagai teks lokal</span></label><textarea id="f_codeEditor" class="code-editor" data-answer="codeEditor" spellcheck="false">${esc(answer('codeEditor')||`function validateRegistration(email) {\n  if (!email) return "Email wajib diisi";\n  // TODO: periksa format email dengan lebih baik\n  return "";\n}`)}</textarea></div><div class="row" style="flex-wrap:wrap;margin-top:10px"><button class="btn btn-primary" onclick="runCodeChecks()">▶ Jalankan tes simulasi</button><button class="btn btn-plain" onclick="resetCodeStarter()">Kembalikan starter code</button></div><div id="codeTestResults" class="reading-card" style="margin-top:12px">${renderCodeTestResults()}</div>${field('codeTests','4. Catatan hasil tes','Tes mana yang lulus/gagal dan apa bukti dari hasilnya?',true)}${field('changeSummary','5. Ringkasan perubahan','Apa yang kamu ubah, mengapa, dan apa yang masih perlu diuji?',true)}`;
if(c.id==='psych')work=`<div class="reading-card"><h3>Research Desk — eksplorasi psikologi nonklinis</h3><p>Tim edukasi ingin memahami preferensi format belajar. Data yang tersedia anonim dan sintetis. Tujuanmu bukan menilai kesehatan mental atau memberi label kepada orang.</p></div><div class="form-grid">${field('psychQuestion','1. Pertanyaan riset','Contoh: format mana yang paling banyak dipilih pada sample latihan?',true)}${selectField('psychMethod','2. Metode yang paling sesuai',['Ringkasan deskriptif dari survei sintetis','Observasi terstruktur (skenario fiktif)','Belum cukup data untuk memilih metode'])}${field('psychFindings','3. Temuan dari tabel','Tuliskan jumlah/persentase pilihan, bukan penilaian individu…',true)}${field('psychLimitations','4. Keterbatasan dan batas kesimpulan','Apa yang tidak bisa dikatakan dari data kecil dan sintetis ini?',true)}${field('psychRecommendation','5. Rekomendasi umum untuk tim edukasi','Saran umum untuk menguji materi belajar lebih lanjut tanpa memberi label kepada siswa…',true)}</div><div class="section-head"><div><h2>Checklist etika</h2><p>Prinsip kerja yang perlu diterapkan sebelum mengolah data.</p></div></div>${[['psychEthicsConsent','Persetujuan dan tujuan penggunaan data dijelaskan.'],['psychEthicsMin','Data yang dikumpulkan dibatasi pada yang diperlukan.'],['psychEthicsPrivate','Identitas responden tidak ditampilkan atau ditebak.'],['psychEthicsScope','Tidak membuat diagnosis, profil mental, atau label “bermasalah”.']].map(([n,l])=>`<label class="check-line"><input type="checkbox" id="${n}" data-answer="${n}" ${answer(n)?'checked':''}><span>${l}</span></label>`).join('')}<div class="callout" style="margin-top:12px">Etika utama: dataset fiktif, tidak ada data pribadi, tidak menyimpulkan diagnosis, dan tidak menganggap hubungan antarvariabel sebagai sebab-akibat.</div>`;
return `<div class="step-kicker">TAHAP 3 · WORKBENCH</div><h1>Kerjakan tugas seperti pekerjaan awal di profesi ini</h1><p class="lead">Isi canvas sesuai instruksi, gunakan bukti yang tersedia, lalu simpan. Draft akan tetap ada saat kamu kembali selama memakai browser/perangkat yang sama.</p>${work}<div class="work-actions"><button class="btn btn-plain" onclick="goStage(1)">← Kembali ke brief</button><div class="row"><button class="btn btn-plain" onclick="saveNow()">▣ Simpan draft</button><button class="btn btn-primary" onclick="completeStage(2,'work')">Selesai draft awal →</button></div></div><div class="stage-footnote">Jangan mengarang bukti: jelaskan asumsi dan keterbatasan. Semua kasus/dataset pada trial ini merupakan simulasi COBAIN.</div>`}
let dataSorted=false;function toggleDataSort(){dataSorted=!dataSorted;renderDataTable()}
function renderDataTableHtml(filter='all',sort=false){let arr=DATA_ROWS.filter(r=>filter==='all'||r[0]===filter);if(sort)arr.sort((a,b)=>b[4]-a[4]);return `<div class="table-wrap"><table class="data-table"><thead><tr><th>Produk</th><th>Minggu</th><th>Unit</th><th>Pesanan</th><th>Pendapatan</th><th>Retur</th></tr></thead><tbody>${arr.map(r=>`<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td><td>${r[2]}</td><td>${r[3]}</td><td>${money(r[4])}</td><td>${r[5]}</td></tr>`).join('')}</tbody></table></div><p class="tiny muted">Menampilkan ${arr.length} baris ${sort?'(diurutkan dari pendapatan tertinggi)':''}.</p>`}
function renderDataTable(){const f=document.getElementById('dataFilter')?.value||'all';const box=document.getElementById('fullDataTable');if(box)box.innerHTML=renderDataTableHtml(f,dataSorted)}
function renderCodeTestResults(){const code=answer('codeEditor')||'';if(!answer('codeTested'))return '<p class="small muted">Tes belum dijalankan. Ubah kode terlebih dahulu, lalu tekan “Jalankan tes simulasi”.</p>';const checks=codeChecks(code);return `<h3>Hasil tes simulasi</h3>${checks.map(x=>`<div class="row between" style="padding:6px 0;border-bottom:1px solid #e5ebf4"><span class="small">${esc(x.name)}</span><span class="badge ${x.ok?'badge-green':'badge-red'}">${x.ok?'Lulus':'Belum lulus'}</span></div>`).join('')}<p class="tiny muted" style="margin-top:8px">Pemeriksaan berdasarkan teks kode yang terlihat, bukan eksekusi program.</p>`}
function codeChecks(code){return [{name:'Menangani email kosong',ok:/!\s*email|email\s*===?\s*["']{2}/.test(code)},{name:'Memeriksa tanda @',ok:/includes\s*\(\s*["']@["']\s*\)/.test(code)||/indexOf\s*\(\s*["']@["']\s*\)/.test(code)},{name:'Memeriksa bagian setelah @',ok:/endsWith\s*\(\s*["']@["']\s*\)/.test(code)||/lastIndexOf/.test(code)||/\.test\s*\(/.test(code)},{name:'Menghasilkan pesan/hasil validasi',ok:/return\s+/.test(code)&&/valid|email|format|wajib/i.test(code)}]}
function runCodeChecks(){const t=getTrial();if(!t)return;const code=t.answers.codeEditor||'';t.answers.codeTested='yes';const checks=codeChecks(code);t.answers.codeTestResult=checks;persist();const el=document.getElementById('codeTestResults');if(el)el.innerHTML=`<h3>Hasil tes simulasi</h3>${checks.map(x=>`<div class="row between" style="padding:6px 0;border-bottom:1px solid #e5ebf4"><span class="small">${esc(x.name)}</span><span class="badge ${x.ok?'badge-green':'badge-red'}">${x.ok?'Lulus':'Belum lulus'}</span></div>`).join('')}<p class="tiny muted" style="margin-top:8px">Pemeriksaan berdasarkan teks kode yang terlihat, bukan eksekusi program.</p>`;toast('Hasil tes simulasi diperbarui.')}
function resetCodeStarter(){const t=getTrial();if(!t)return;t.answers.codeEditor=`function validateRegistration(email) {\n  if (!email) return "Email wajib diisi";\n  // TODO: periksa format email dengan lebih baik\n  return "";\n}`;t.answers.codeTested='';persist();render();toast('Starter code dipulihkan.')}
function renderClientStage(c,m,t){return `<div class="step-kicker">TAHAP 4 · MASUKAN KLIEN SIMULASI</div><h1>Situasi berubah. Apa keputusanmu?</h1><p class="lead">Di pekerjaan nyata, brief bisa berubah setelah ada masukan. Tugasmu bukan selalu menyetujui klien—kamu perlu memahami konsekuensi, mempertimbangkan bukti, dan menjelaskan keputusan.</p><div class="reading-card"><div class="row" style="align-items:flex-start;gap:12px"><div class="role-icon" style="width:44px;height:44px;font-size:22px">💬</div><div style="flex:1"><span class="badge badge-orange">PESAN DARI KLIEN FIKTIF</span><h3 style="margin-top:8px">${esc(c.id==='marketing'?'Update anggaran':c.id==='ux'?'Prioritas pengalaman mobile':c.id==='data'?'Pertanyaan manajer tentang penyebab':c.id==='content'?'Permintaan klaim produk':c.id==='software'?'Requirement tambahan':'Permintaan analisis yang tidak didukung data')}</h3><p>${esc(m.clientChange)}</p></div></div>${t.clientChange?'<div class="callout green" style="margin-top:13px">✓ Perubahan ini sudah kamu terima dan tercatat pada trial.</div>':''}<div class="work-actions"><span class="tiny muted">Baca ulang draft awalmu sebelum menentukan revisi.</span><button class="btn ${t.clientChange?'btn-soft':'btn-primary'}" onclick="applyClientChange()">${t.clientChange?'✓ Perubahan diterima':'Terima perubahan klien'}</button></div></div><div class="reading-card"><h3>Pertanyaan untuk keputusanmu</h3><ul><li>Apa tujuan utama yang tetap perlu dijaga?</li><li>Bagian mana dari rencana awal yang perlu disesuaikan?</li><li>Apa trade-off atau risiko dari perubahanmu?</li><li>Bukti atau informasi apa yang masih dibutuhkan?</li></ul></div><div class="field"><label for="f_clientThinking">Catatan keputusan awal</label><textarea id="f_clientThinking" data-answer="clientThinking" placeholder="Aku akan mempertahankan… dan mengubah… karena… Risiko/hal yang perlu dicek…">${esc(answer('clientThinking'))}</textarea></div><div class="work-actions"><button class="btn btn-plain" onclick="goStage(2)">← Tinjau draft</button><button class="btn btn-primary" onclick="completeStage(3,'clientChange')">Selesai menanggapi →</button></div><div class="stage-footnote">Skenario perubahan telah ditulis sebelumnya sebagai bagian blueprint; AI demo tidak mengarang fakta bisnis acak.</div>`}
function applyClientChange(){const t=getTrial();t.clientChange=true;t.answers.clientThinking=t.answers.clientThinking||'';persist();render();toast('Perubahan klien simulasi tercatat. Lanjutkan dengan keputusan dan revisi.')}
function renderRevisionStage(c,m,t){const fields={marketing:[['revisionAudience','Target/insight revisi','Apakah target/insight tetap relevan?'],['revisionBudget','Anggaran revisi (Rp)','2400000'],['revisionPlan','Plan/kanal revisi','Apa yang dikurangi atau dipertahankan?'],['revisionReason','Alasan dan trade-off','Jelaskan alasan dan hal yang dikorbankan.']],ux:[['revisionFlow','User flow revisi','Tuliskan alur baru…'],['revisionChanges','Perubahan wireframe','Apa yang berubah di layar/form/error?'],['revisionReason','Alasan desain dan trade-off','Jelaskan perubahan berdasarkan kebutuhan pengguna.']],data:[['revisionFinding','Temuan revisi','Apa yang dapat dinyatakan dari angka yang tersedia?'],['revisionNextData','Data tambahan yang dibutuhkan','Apa yang diperlukan untuk menyelidiki penyebab?'],['revisionReason','Alasan dan batas kesimpulan','Tuliskan apa yang tidak bisa dipastikan.']],content:[['revisionHook','Hook revisi','Buat tetap menarik tanpa klaim tak terbukti…'],['revisionScript','Skrip revisi','Tulis ulang klaim/kalimat yang diubah…'],['revisionReason','Alasan revisi','Mengapa bahasa ini lebih aman dan tetap efektif?']],software:[['revisionCode','Perubahan kode/logic','Tulis perubahan penting atau potongan kode yang direvisi…'],['revisionTests','Tes tambahan','Apa test case tambahan yang kamu jalankan?'],['revisionReason','Alasan revisi','Jelaskan bagaimana perubahan menangani requirement baru.']],psych:[['revisionEthicalResponse','Respons terhadap permintaan klien','Jelaskan alasan menolak kesimpulan individu…'],['revisionAnalysis','Analisis aman yang dapat dilakukan','Ringkasan kelompok/variabel yang relevan…'],['revisionReason','Alasan dan keterbatasan','Apa yang tidak dapat disimpulkan dari data ini?']]};let list=fields[c.id];return `<div class="step-kicker">TAHAP 5 · REVISI PEKERJAAN</div><h1>Perbaiki pekerjaanmu berdasarkan perubahan baru</h1><p class="lead">Versi revisi adalah bukti bahwa kamu dapat merespons feedback. Simpan versi awal di Workbench, lalu tulis perubahan dan alasan di bawah.</p><div class="callout blue">${esc(m.clientChange)}</div><div class="form-grid" style="margin-top:16px">${list.map(([n,l,p])=>field(n,l,p,list.length<3)).join('')}</div><div class="reading-card"><h3>Checklist revisi yang baik</h3><ul><li>Ada perubahan yang terlihat dibanding versi awal.</li><li>Alasannya mengacu pada brief, data, requirement atau kebutuhan pengguna.</li><li>Kamu menjelaskan trade-off dan batasan, bukan hanya menyebut hasil bagus.</li></ul></div><div class="work-actions"><button class="btn btn-plain" onclick="goStage(3)">← Kembali ke masukan</button><button class="btn btn-primary" onclick="completeStage(4,'revision')">Selesaikan revisi →</button></div>`}
function renderReviewStage(c,m,t){const f=t.feedback;return `<div class="step-kicker">TAHAP 6 · REVIEW HASIL KERJA</div><h1>Review seperti menerima masukan kerja</h1><p class="lead">Reviewer demo akan meninjau kelengkapan dan sinyal sederhana pada artefak yang kamu isi. Review ini menggunakan aturan lokal—belum menggunakan model AI sungguhan dan bukan penilaian profesional.</p><div class="reading-card"><h3>Yang akan diperiksa</h3><ul>${c.rubric.map(r=>`<li>${esc(r[0])} <span class="muted">(${r[1]}%)</span></li>`).join('')}</ul></div>${f?`<div class="result-hero" style="padding:19px;margin-bottom:15px"><div class="tiny" style="color:#d8e6ff">SKOR REVIEW DEMO</div><div class="score-circle" style="width:88px;height:88px;font-size:24px">${f.score}</div><p>${esc(f.summary)}</p></div><div class="card pad"><h3 class="card-title">Rincian rubrik</h3>${f.criteria.map(x=>`<div class="score-row"><span class="score-name">${esc(x.name)}</span><div class="score-track"><span style="width:${x.score}%"></span></div><strong>${x.score}/100</strong></div>`).join('')}</div><div class="section-head"><div><h2>Feedback yang bisa ditindaklanjuti</h2><p>Catatan terhubung dengan ada/tidaknya bagian pekerjaan.</p></div></div>${f.feedback.map(x=>`<div class="feedback-card"><h4>${esc(x.title)}</h4><p>${esc(x.body)}</p></div>`).join('')}`:`<div class="card pad" style="text-align:center"><div style="font-size:32px">🧾</div><h3 class="card-title" style="margin:8px 0">Draft kamu siap ditinjau</h3><p class="small muted">Jalankan review untuk melihat bagian yang sudah tercakup, area yang perlu diperbaiki, dan bukti dari draft yang kamu isi.</p><button class="btn btn-primary" onclick="runReview()">Periksa hasil kerja</button></div>`}<div class="callout" style="margin-top:15px">Jangan anggap skor sebagai ukuran bakat. Gunakan feedback sebagai bahan untuk memperbaiki artefak dan merenungkan pengalaman.</div><div class="work-actions"><button class="btn btn-plain" onclick="goStage(4)">← Perbaiki revisi</button>${f?`<button class="btn btn-primary" onclick="completeStage(5,'review')">Lanjut ke refleksi →</button>`:`<button class="btn btn-plain" onclick="navigate('career')">Lihat detail profesi</button>`}</div>`}
function runReview(){const t=getTrial(),c=getCareer(),m=getMeta();const req=m.required||[];const weights=c.rubric;let filled=req.filter(k=>String(t.answers[k]??'').trim().length>0).length;let revised=Object.keys(t.answers).filter(k=>k.startsWith('revision')).filter(k=>String(t.answers[k]||'').trim().length>0).length;const criteria=weights.map((r,i)=>{const base=filled/Math.max(1,req.length);let val=Math.round(Math.min(100,28+base*65+(revised>0?8:0)+(t.clientChange?5:0)+(i%3)*2));return {name:r[0],weight:r[1],score:val}});let score=Math.round(criteria.reduce((a,r)=>a+r.score*r.weight,0)/100);let fb=[];if(filled<req.length)fb.push({title:'Lengkapi bukti utama',body:`Ada ${req.length-filled} bagian inti yang masih kosong. Tambahkan bukti atau alasan pada bagian tersebut supaya reviewer bisa memahami proses keputusanmu.`});else fb.push({title:'Artefak inti sudah terisi',body:'Bagian utama proyek telah memiliki isian. Pastikan setiap keputusan dapat ditelusuri ke brief, data, kebutuhan, atau acceptance criteria yang relevan.'});if(!t.clientChange)fb.push({title:'Respons terhadap perubahan',body:'Kamu belum mencatat bahwa perubahan klien telah diterima. Pekerjaan sering memiliki batasan baru; jelaskan konsekuensi dan revisinya.'});else fb.push({title:'Jelaskan trade-off',body:'Pastikan revisi bukan hanya mengganti isi—catat mengapa keputusan baru lebih sesuai dan apa konsekuensi yang kamu pertimbangkan.'});if(revised===0)fb.push({title:'Revisi masih perlu ditulis',body:'Tahap berikutnya adalah menyatakan apa yang diubah dan alasan di baliknya. Ini membantu membedakan hasil kerja awal dengan respons terhadap feedback.'});if(c.id==='psych')fb.push({title:'Periksa batas etika dan data',body:'Jangan mengidentifikasi individu atau membuat diagnosis. Nyatakan keterbatasan data sintetis dan bedakan temuan deskriptif dari penjelasan sebab-akibat.'});if(c.id==='software'&&!(t.answers.codeTested))fb.push({title:'Jalankan tes simulasi',body:'Tes kode di sini hanya memeriksa pola teks. Jangan mengklaim program benar-benar berjalan; uji di lingkungan yang aman pada tahap pengembangan sungguhan.'});t.feedback={score,criteria,feedback:fb,summary:score>=80?'Artefak demo menunjukkan cakupan yang baik; periksa saran rinci sebelum menyatakan siap.':score>=60?'Ada dasar pekerjaan yang bisa dikembangkan; gunakan catatan review untuk melengkapi bukti dan revisi.':'Review menunjukkan beberapa bagian penting belum tercakup. Gunakan saran berikut sebagai daftar kerja, bukan penilaian kemampuan dirimu.'};persist();render();toast('Review demo selesai. Skor dihitung dari kelengkapan artefak lokal.')}
function renderReflectionStage(c,m,t){return `<div class="step-kicker">TAHAP 7 · REFLEKSI KARIER</div><h1>Apa yang kamu pelajari tentang pekerjaan ini?</h1><p class="lead">Refleksi ini membantumu mengeksplorasi pengalaman. Tidak ada jawaban yang menentukan jurusan atau profesi terbaik untukmu.</p><div class="reflection-prompt"><strong>1. Bagian pekerjaan apa yang paling menarik buatmu, dan mengapa?</strong><textarea data-answer="reflectionEnjoy" placeholder="Bagian yang paling menarik adalah… karena…">${esc(answer('reflectionEnjoy'))}</textarea></div><div class="reflection-prompt"><strong>2. Bagian mana yang paling sulit atau membuatmu perlu berpikir ulang?</strong><textarea data-answer="reflectionHard" placeholder="Bagian yang sulit…; cara yang kupakai untuk mengatasinya…">${esc(answer('reflectionHard'))}</textarea></div><div class="reflection-prompt"><strong>3. Apa yang ingin kamu pelajari atau coba selanjutnya?</strong><textarea data-answer="reflectionNext" placeholder="Aku ingin mencoba/mempelajari…">${esc(answer('reflectionNext'))}</textarea></div><div class="callout blue">Career Passport menyimpan hasil dari simulasi ini sebagai catatan eksplorasi. Ia bukan rekomendasi jurusan otomatis, tes bakat, atau sertifikat kompetensi profesi.</div><div class="work-actions"><button class="btn btn-plain" onclick="goStage(5)">← Kembali ke review</button><button class="btn btn-primary" onclick="finishTrial()">Simpan refleksi & selesaikan trial ✓</button></div>`}
function renderMentorPanel(t,c,m){const msgs=t.chat||[];return `<aside class="card mentor-card"><div class="mentor-head"><div class="mentor-avatar">✦</div><div><strong>AI Career Mentor</strong><small>Simulasi respons lokal · bukan AI online</small></div><span class="badge badge-orange" style="margin-left:auto">DEMO</span></div><div class="chat-body" id="chatBody">${msgs.length?msgs.map(x=>`<div class="bubble ${x.role==='user'?'user':''}">${esc(x.text)}</div>`).join(''):`<div class="bubble">Hai! Aku mentor demo untuk <strong>${esc(c.title)}</strong>. Aku bisa membantu menjelaskan brief atau memberi petunjuk. Aku tidak akan mengerjakan semua proyek untukmu.</div><div class="bubble">Coba mulai dari pertanyaan: apa tujuan brief, bukti apa yang kamu punya, dan hasil apa yang perlu kamu buat?</div>`}</div><div class="chat-suggestions"><button onclick="askMentorPreset('Apa yang harus kukerjakan dulu?')">Langkah pertama?</button><button onclick="askMentorPreset('Beri aku petunjuk, bukan jawaban lengkap.')">Beri petunjuk</button><button onclick="askMentorPreset('Bagaimana cara meninjau hasil kerjaku?')">Review pekerjaanku</button></div><form class="chat-compose" onsubmit="sendMentor(event)"><input id="mentorInput" placeholder="Tanya mentor demo…" aria-label="Pesan untuk mentor"><button aria-label="Kirim pesan">➤</button></form><div class="mentor-disclaimer">Respons dibuat oleh aturan lokal di file HTML. Belum terhubung ke model AI, tidak dikirim ke server, dan bisa terbatas.</div></aside>`}
function mentorResponse(q,c,m,t){let s=q.toLowerCase();if(/langkah pertama|mulai|dulu|pertama/.test(s))return `Mulai dari brief, ya. Tulis tujuan yang diminta, batasan yang ada, dan bukti yang tersedia. Setelah itu buat draft kecil—jangan langsung lompat ke solusi final. Di tahap ini: ${STAGES[t.stage]?.[0]||'review'}.`;if(/petunjuk|hint|bantu|bingung/.test(s))return `Petunjuk bertahap: (1) temukan kalimat dalam brief yang menyatakan tujuan; (2) cari data/kebutuhan yang mendukung pilihanmu; (3) tulis alasan singkat. Contohnya pada ${c.title}, hasil kerja pentingnya adalah ${m.deliverables[0]}. Coba kamu isi dengan kata-katamu sendiri dulu.`;if(/review|nilai|feedback|periksa|cek/.test(s))return `Review awal: bandingkan hasilmu dengan tujuan brief, bukti yang tersedia, keterbatasan data, dan requirement. Kalau ada pilihan, jelaskan mengapa kamu mengambilnya dan apa trade-off-nya. Review akhir di tahap 6 akan menampilkan check sederhana berdasarkan kelengkapan artefak.`;if(/anggaran|budget/.test(s))return c.id==='marketing'?'Pisahkan biaya tiap kanal dan pastikan total tidak melebihi batas brief. Bila anggaran berubah menjadi Rp2.400.000, tentukan prioritas berdasarkan tujuan kampanye—jangan sekadar memangkas semua pos dengan jumlah sama.':'Untuk keputusan yang melibatkan batasan, tulis angka/batas yang diberikan dalam brief dan cek kembali apakah solusi melampauinya.';if(/data|bukti|insight/.test(s))return c.id==='data'?'Sebutkan angka pembanding secara eksplisit, lalu pisahkan “apa yang terlihat di tabel” dari “mengapa itu terjadi”. Dataset kecil ini tidak cukup untuk memastikan penyebab.':'Tandai bukti yang mendukung klaimmu. Jangan menyebut dugaan sebagai fakta; tulis juga keterbatasan sumber.';if(/klien|revisi|perubahan/.test(s))return `Setelah perubahan klien, tulis: apa yang berubah, bagian draft mana terdampak, keputusan apa yang kamu ambil, dan trade-off yang muncul. Kamu bisa berpindah ke tahap “Revisi pekerjaan” untuk mencatat versi baru.`;return `Aku menangkap pertanyaanmu tentang “${q.slice(0,100)}”. Untuk proyek ${c.title}, coba hubungkan jawabanmu dengan tujuan brief, sumber/bukti yang tersedia, hasil kerja ${m.deliverables[0]}, dan batasan skenario. Ini mentor demo lokal, jadi jawabanku berupa petunjuk umum—bukan hasil AI sungguhan.`}
function askMentorPreset(q){const el=document.getElementById('mentorInput');if(el)el.value=q;const fake={preventDefault(){}};sendMentor(fake,q)}
function sendMentor(e,forced=''){if(e?.preventDefault)e.preventDefault();const el=document.getElementById('mentorInput');const q=forced||(el?.value||'').trim();if(!q)return;const t=getTrial(),c=getCareer(),m=getMeta();t.chat=t.chat||[];t.chat.push({role:'user',text:q});t.chat.push({role:'assistant',text:mentorResponse(q,c,m,t)});persist();render();const inp=document.getElementById('mentorInput');if(inp)inp.focus()}
function completeStage(index,key){const t=getTrial();if(!t)return;const a=t.answers||{};if(index===0&&!a.introRead){toast('Centang dulu konfirmasi bahwa kamu sudah membaca pengenalan profesi.');return}if(index===1&&!a.briefRead){toast('Centang dulu bahwa kamu sudah memahami brief dan bahan kerja.');return}if(index===2){const m=getMeta();let count=m.required.filter(k=>String(a[k]??'').trim()!=='' ).length;if(count<Math.min(3,m.required.length)){toast('Isi minimal 3 bagian utama Workbench sebelum lanjut.');return}if(currentCareer==='marketing'&&Number(a.budget)>3000000){toast('Anggaran melebihi batas brief Rp3.000.000. Sesuaikan atau jelaskan di catatan sebelum lanjut.');return}if(currentCareer==='psych'){const eth=['psychEthicsConsent','psychEthicsMin','psychEthicsPrivate','psychEthicsScope'];if(eth.some(k=>!a[k])){toast('Lengkapi checklist etika sebelum meninggalkan Workbench.');return}}}if(index===3&&!t.clientChange){toast('Terima dulu perubahan klien simulasi untuk melihat dampaknya.');return}if(index===4){const keys=Object.keys(a).filter(k=>k.startsWith('revision')&&String(a[k]||'').trim().length>=8);if(keys.length<1){toast('Tuliskan setidaknya satu revisi dan alasan singkat.');return}}if(index===5&&!t.feedback){toast('Jalankan review terlebih dahulu.');return}t.completedStages=Array.from(new Set([...(t.completedStages||[]),index]));t.stage=Math.min(6,index+1);persist();render();toast('Tahap selesai—draft tersimpan otomatis.')}
function goStage(n){const t=getTrial();if(!t)return;let max=0;while((t.completedStages||[]).includes(max)&&max<6)max++;if(n>max&&!t.completedStages.includes(n)){toast('Selesaikan tahap sebelumnya terlebih dahulu.');return}t.stage=n;persist();render()}
function startTrial(id){const c=getCareer(id),existing=getTrial(id);if(existing&&!existing.complete){currentCareer=id;currentPage='trial';render();return}if(existing?.complete){restartTrialPrompt(id);return}if(state.points<c.cost_points){modalCareer=id;openTopupPrompt(c);return}state.points-=c.cost_points;state.transactions.unshift({title:'Mulai Career Trial: '+c.title,date:new Date().toISOString(),delta:-c.cost_points,type:'trial'});currentCareer=id;state.trials[id]={careerId:id,stage:0,answers:{},completedStages:[],chat:[],clientChange:false,feedback:null,complete:false,startedAt:new Date().toISOString()};persist();currentPage='trial';render();toast(`Trial dimulai. ${c.cost_points} points demo digunakan.`)}
function continueTrial(id){currentCareer=id;const t=getTrial(id);if(t?.complete){navigate('results');return}if(!t){setCareer(id);return}navigate('trial')}
function restartTrialPrompt(id){const c=getCareer(id);document.getElementById('modalRoot').innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><div class="modal"><h2>Ulangi ${esc(c.title)}?</h2><p>Ulangan akan membuat draft baru dan menggunakan ${c.cost_points} points demo. Hasil sebelumnya tetap tercatat di ringkasan riwayat lokal, tetapi draft aktif untuk profesi ini diganti.</p><div class="modal-actions"><button class="btn btn-plain" onclick="closeModal()">Batal</button><button class="btn btn-primary" onclick="restartTrial('${id}')">Ya, mulai ulang</button></div></div></div>`}
function restartTrial(id){closeModal();delete state.trials[id];persist();startTrial(id)}
function openTopupPrompt(c){document.getElementById('modalRoot').innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><div class="modal"><h2>Points demo belum cukup</h2><p>Trial ${esc(c.title)} membutuhkan ${c.cost_points} points. Kamu bisa menambah points lewat simulasi top-up.</p><div class="modal-actions"><button class="btn btn-plain" onclick="closeModal()">Nanti</button><button class="btn btn-primary" onclick="closeModal();navigate('points')">Buka COBAIN Points</button></div></div></div>`}
function saveNow(){persist();toast('Draft disimpan di browser ini. Gunakan perangkat/browser yang sama untuk melanjutkan.')}
function finishTrial(){const t=getTrial();if(!t)return;const keys=['reflectionEnjoy','reflectionHard','reflectionNext'];const missing=keys.filter(k=>String(t.answers[k]||'').trim().length<8);if(missing.length){toast('Isi tiga refleksi singkat (minimal sekitar 8 karakter tiap jawaban).');return}t.completedStages=Array.from(new Set([...(t.completedStages||[]),6]));t.stage=6;t.complete=true;t.completedAt=new Date().toISOString();if(!t.feedback)runReviewWithoutRender();persist();currentPage='results';render();toast('Trial selesai! Hasil masuk ke Career Passport lokal.')}
function runReviewWithoutRender(){const t=getTrial(),c=getCareer(),m=getMeta();let filled=m.required.filter(k=>String(t.answers[k]??'').trim()).length;let criteria=c.rubric.map((r,i)=>({name:r[0],weight:r[1],score:Math.min(100,Math.round(30+filled/m.required.length*60+Object.keys(t.answers).filter(k=>k.startsWith('revision')&&String(t.answers[k]||'').trim()).length*2))}));let score=Math.round(criteria.reduce((a,x)=>a+x.score*x.weight,0)/100);t.feedback={score,criteria,summary:'Ringkasan review demo atas draft dan refleksi yang disimpan.',feedback:[{title:'Catatan penggunaan hasil',body:'Nilai ini dihitung secara lokal berdasarkan indikator kelengkapan, bukan oleh model AI atau penilai profesional.'}]}}
function renderResults(){const c=getCareer(),m=getMeta(),t=getTrial(),f=t?.feedback;if(!t)return `<div class="card pad"><h1 class="h1">Belum ada hasil trial</h1><button class="btn btn-primary" onclick="navigate('explore')">Jelajahi profesi</button></div>`;return `<div class="result-hero"><div class="award">🏅</div><div class="tiny" style="color:#d7e6ff;letter-spacing:.12em;font-weight:850">CAREER TRIAL SELESAI</div><h1>${esc(c.title)}</h1><p>${esc(c.display_role)} · Skenario kerja simulasi · Diselesaikan ${dateFmt(t.completedAt)}</p><div class="score-circle">${f?.score??'-'}</div><p>Skor review demo · Bukan tes bakat atau prediksi karier</p><div class="row" style="justify-content:center;flex-wrap:wrap;margin-top:17px"><button class="btn btn-orange" onclick="navigate('passport')">Lihat Career Passport</button><button class="btn btn-white" onclick="printCertificate('${c.id}')">Cetak Certificate of Completion</button></div></div><div class="section-head"><div><h2>Ringkasan pengalamanmu</h2><p>Catatan dari draft, revisi dan refleksi yang tersimpan di browser.</p></div></div><div class="grid grid-2"><div class="card pad"><h3 class="card-title">Hasil kerja (artefak)</h3><ul class="bullet-list">${m.deliverables.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><p class="tiny muted">Artefak disimpan sebagai teks/field lokal, bukan file proyek yang disertifikasi.</p></div><div class="card pad"><h3 class="card-title">Feedback ringkas</h3>${(f?.feedback||[]).map(x=>`<div class="feedback-card"><h4>${esc(x.title)}</h4><p>${esc(x.body)}</p></div>`).join('')||'<p class="small muted">Belum ada feedback.</p>'}</div><div class="card pad"><h3 class="card-title">Refleksi kamu</h3><div class="reflection-prompt"><strong>Yang menarik</strong><p class="small">${esc(t.answers.reflectionEnjoy)}</p></div><div class="reflection-prompt"><strong>Yang sulit</strong><p class="small">${esc(t.answers.reflectionHard)}</p></div><div class="reflection-prompt"><strong>Selanjutnya</strong><p class="small">${esc(t.answers.reflectionNext)}</p></div></div><div class="card pad"><h3 class="card-title">Langkah berikutnya</h3><p class="small muted">Coba profesi lain, baca referensi tambahan, atau perbaiki artefak pada trial ulang. Hasil ini tidak menentukan profesi/jurusan yang cocok untukmu.</p><div class="row" style="flex-wrap:wrap"><button class="btn btn-primary" onclick="navigate('explore')">Coba profesi lain</button><button class="btn btn-plain" onclick="navigate('passport')">Career Passport</button></div></div></div>${footer()}`}
function renderMyTrials(){const started=CAREERS.filter(c=>getTrial(c.id));return `<div class="eyebrow">PERJALANAN BELAJAR</div><h1 class="h1">Career Trial milikmu</h1><p class="subtitle">Lanjutkan draft, buka hasil, atau mulai profesi lain. Status ini tersimpan di browser lokal.</p><div class="grid" style="margin-top:20px">${started.length?started.map(c=>{const t=getTrial(c.id),p=progress(c);return `<div class="card pad"><div class="row align-center"><div class="role-icon">${CAREER_META[c.id].icon}</div><div style="flex:1"><h3 class="card-title">${esc(c.title)}</h3><p class="tiny muted">${esc(c.display_role)} · ${p.label}</p></div><span class="badge ${t.complete?'badge-green':'badge-blue'}">${t.complete?'Selesai':'Berjalan'}</span></div><div class="progress-track" style="margin:14px 0"><span style="width:${p.pct}%"></span></div><div class="row between"><span class="tiny muted">${t.complete?'Selesai '+dateFmt(t.completedAt):'Tahap '+(t.stage+1)+' dari 7'}</span><button class="btn btn-soft" onclick="${t.complete?`currentCareer='${c.id}';navigate('results')`:`continueTrial('${c.id}')`}">${t.complete?'Lihat hasil':'Lanjutkan'} →</button></div></div>`}).join(''):'<div class="card empty">Belum ada trial yang dimulai. Pilih profesi untuk membuat proyek pertama.</div>'}</div><div style="margin-top:18px"><button class="btn btn-primary" onclick="navigate('explore')">+ Mulai profesi baru</button></div>${footer()}`}
function renderLibrary(){let all=Object.entries(SOURCES).map(([id,s])=>({id,...s}));let cats={M:'Marketing Strategist',U:'UI/UX Designer',D:'Data Analyst',C:'Content Creator',S:'Software Developer',P:'Psikologi (Eksplorasi)'};all=all.map(s=>({...s,career:cats[s.id[0]]||'Umum'}));let q=libraryQuery.toLowerCase();all=all.filter(s=>(s.title+' '+s.publisher+' '+s.kind+' '+s.why+' '+s.career).toLowerCase().includes(q)&&(libraryFilter==='all'||s.career===libraryFilter));return `<div class="eyebrow">REFERENCE LIBRARY</div><h1 class="h1">Perpustakaan referensi</h1><p class="subtitle">Sumber untuk pengenalan profesi dan dasar desain simulasi. Setiap link membuka halaman sumber aslinya. Pengecekan konteks masih menjadi bagian dari desk research, belum validasi lapangan COBAIN.</p><div class="library-filter"><input id="libSearch" value="${esc(libraryQuery)}" oninput="libraryQuery=this.value;renderLibraryList()" placeholder="Cari judul, penerbit, atau topik…"><select id="libCareer" onchange="libraryFilter=this.value;renderLibraryList()"><option value="all">Semua profesi</option>${Object.values(cats).map(x=>`<option ${libraryFilter===x?'selected':''}>${esc(x)}</option>`).join('')}</select></div><div id="libraryList" class="result-list">${renderLibraryListHtml(all)}</div><div class="callout" style="margin-top:16px">COBAIN menampilkan tautan dan ringkasan singkat, bukan menyalin isi buku/kursus yang memiliki hak cipta. Beberapa sumber dari luar Indonesia atau kategori pekerjaan berdekatan perlu ditafsirkan sesuai konteks.</div>${footer()}`}
function renderLibraryListHtml(list){return list.length?list.map(s=>`<div class="card pad"><div class="row between" style="align-items:flex-start"><div><span class="badge">${esc(s.career)}</span><h3 class="card-title" style="margin-top:8px">${esc(s.title)}</h3><p class="small muted" style="margin:5px 0">${esc(s.publisher)} · ${esc(s.kind)}</p><p class="small muted">${esc(s.why)}</p><a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">Buka sumber asli ↗</a></div><span class="badge badge-blue">${esc(s.id)}</span></div></div>`).join(''):'<div class="card empty">Tidak ada sumber yang cocok dengan pencarian.</div>'}
function renderLibraryList(){const el=document.getElementById('libraryList');if(!el)return;let cats={M:'Marketing Strategist',U:'UI/UX Designer',D:'Data Analyst',C:'Content Creator',S:'Software Developer',P:'Psikologi (Eksplorasi)'};let all=Object.entries(SOURCES).map(([id,s])=>({...s,id,career:cats[id[0]]||'Umum'}));let q=(document.getElementById('libSearch')?.value||libraryQuery).toLowerCase();let filter=document.getElementById('libCareer')?.value||libraryFilter;libraryQuery=q;libraryFilter=filter;all=all.filter(s=>(s.title+' '+s.publisher+' '+s.kind+' '+s.why+' '+s.career).toLowerCase().includes(q)&&(filter==='all'||s.career===filter));el.innerHTML=renderLibraryListHtml(all)}
function renderPassport(){const completed=CAREERS.filter(c=>getTrial(c.id)?.complete);return `<div class="eyebrow">CAREER PASSPORT</div><h1 class="h1">Perjalanan eksplorasi kariermu</h1><p class="subtitle">Passport menyimpan pengalaman trial yang kamu selesaikan. Gunakan sebagai catatan belajar—bukan sebagai keputusan otomatis tentang karier masa depan.</p><div class="passport-card" style="margin-top:20px"><div class="passport-header"><img src="${LOGO_ICON}" alt="COBAIN"><div><div class="passport-name">Career Passport</div><div class="tiny muted">COBAIN · Career Exploration</div></div><span class="badge badge-orange" style="margin-left:auto">DEMO LOKAL</span></div><div class="row mobile-col"><div style="flex:1"><div class="tiny muted">NAMA SISWA</div><div style="font-size:20px;font-weight:900;color:var(--navy);margin:4px 0 13px">${esc(state.profile.name)}</div><div class="tiny muted">SEKOLAH</div><div style="font-size:13px;font-weight:750;margin-top:4px">${esc(state.profile.school||'Belum diisi')}</div></div><div class="grid grid-2" style="min-width:240px"><div class="stat"><div class="label">Trial selesai</div><strong>${completed.length}</strong></div><div class="stat"><div class="label">Profesi tersedia</div><strong>6</strong></div></div></div><div class="divider"></div><div class="tiny muted">Catatan eksplorasi ini memuat hasil trial yang diselesaikan di perangkat/browser ini. Skor bersifat feedback simulasi.</div></div><div class="section-head"><div><h2>Riwayat trial selesai</h2><p>Setiap item terhubung dengan hasil, feedback dan refleksi.</p></div><button class="btn btn-primary" onclick="navigate('explore')">＋ Coba profesi baru</button></div><div class="grid grid-2">${completed.length?completed.map(c=>{const t=getTrial(c.id);return `<div class="card pad"><div class="row align-center"><div class="role-icon">${CAREER_META[c.id].icon}</div><div style="flex:1"><h3 class="card-title">${esc(c.title)}</h3><p class="tiny muted">Selesai ${dateFmt(t.completedAt)}</p></div><span class="badge badge-green">Selesai</span></div><div class="row between" style="margin-top:15px"><span class="small muted">Review demo: <strong>${t.feedback?.score??'-'}/100</strong></span><button class="btn btn-soft" onclick="currentCareer='${c.id}';navigate('results')">Buka hasil →</button></div><button class="btn btn-plain" style="margin-top:10px;width:100%" onclick="printCertificate('${c.id}')">Cetak Certificate of Completion</button></div>`}).join(''):'<div class="card empty" style="grid-column:1/-1">Belum ada trial selesai. Selesaikan tahap pekerjaan, review, dan refleksi untuk mengisi Career Passport.</div>'}</div>${footer()}`}
function renderPoints(){return `<div class="eyebrow">COBAIN POINTS</div><h1 class="h1">Saldo dan akses Career Trial</h1><p class="subtitle">Di versi produk online, points dan pembayaran harus diproses backend. Di mockup ini, semua transaksi hanyalah simulasi lokal dan tidak memotong uang sungguhan.</p><div class="wallet-hero" style="margin-top:19px"><div><small>SALDO TERSEDIA (DEMO)</small><strong>${state.points.toLocaleString('id-ID')} pts</strong><small>Disimpan di browser perangkat ini</small></div><div style="font-size:38px">◈</div></div><div class="section-head"><div><h2>Pilih paket top-up demo</h2><p>Tekan tombol untuk mensimulasikan penambahan saldo.</p></div></div><div class="grid grid-3">${[{name:'Starter',pts:100,price:10000,desc:'Cocok mencoba satu trial pendek.'},{name:'Explorer',pts:300,price:25000,desc:'Untuk mencoba beberapa profesi.',featured:true},{name:'Career Pack',pts:700,price:50000,desc:'Untuk eksplorasi lebih banyak trial.'}].map(p=>`<div class="package-card ${p.featured?'featured':''}">${p.featured?'<span class="badge badge-blue">Populer (demo)</span>':''}<h3>${p.name}</h3><div class="package-price">${p.pts} pts</div><div class="small muted">${money(p.price)} · simulasi</div><p>${p.desc}</p><button class="btn ${p.featured?'btn-primary':'btn-plain'}" onclick="confirmTopup(${p.pts},${p.price},'${p.name}')">Tambah points demo</button></div>`).join('')}</div><div class="section-head"><div><h2>Riwayat aktivitas points</h2><p>Termasuk bonus awal, penggunaan trial dan top-up simulasi.</p></div><button class="btn btn-plain" onclick="resetDemoPoints()">Reset saldo demo</button></div><div class="card pad">${state.transactions.length?state.transactions.map(x=>`<div class="transaction"><div class="trans-icon">${x.delta>=0?'＋':'−'}</div><div><strong>${esc(x.title)}</strong><small>${dateFmt(x.date)} · ${x.type==='trial'?'Penggunaan trial':x.type==='topup'?'Top-up simulasi':'Aktivitas demo'}</small></div><div class="delta" style="color:${x.delta>=0?'var(--green)':'var(--red)'}">${x.delta>0?'+':''}${x.delta} pts</div></div>`).join(''):'<div class="empty">Belum ada aktivitas.</div>'}</div><div class="callout" style="margin-top:15px">Pada versi online nanti, saldo tidak boleh disunting dari browser. Pembayaran harus dikonfirmasi lewat notifikasi server dari penyedia pembayaran.</div>${footer()}`}
function confirmTopup(pts,price,name){document.getElementById('modalRoot').innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><div class="modal"><h2>Simulasikan top-up?</h2><p>Paket ${esc(name)} menambah ${pts} points dengan nominal tampilan ${money(price)}. Tidak ada pembayaran sungguhan dan tidak ada uang yang ditarik.</p><div class="callout">Gunakan tombol konfirmasi hanya untuk demonstrasi UI.</div><div class="modal-actions"><button class="btn btn-plain" onclick="closeModal()">Batal</button><button class="btn btn-primary" onclick="doTopup(${pts},${price},'${name}')">Konfirmasi simulasi</button></div></div></div>`}
function doTopup(pts,price,name){state.points+=pts;state.transactions.unshift({title:`Top-up demo: ${name} (${money(price)})`,date:new Date().toISOString(),delta:pts,type:'topup'});persist();closeModal();render();toast(`Demo top-up berhasil. Saldo bertambah ${pts} points, tanpa pembayaran sungguhan.`)}
function resetDemoPoints(){document.getElementById('modalRoot').innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><div class="modal"><h2>Reset data points demo?</h2><p>Saldo kembali ke 350 points bonus awal. Data trial dan refleksi tidak dihapus.</p><div class="modal-actions"><button class="btn btn-plain" onclick="closeModal()">Batal</button><button class="btn btn-primary" onclick="state.points=350;state.transactions=[{title:'Saldo demo di-reset',date:new Date().toISOString(),delta:350,type:'bonus'}];persist();closeModal();render()">Reset</button></div></div></div>`}
function renderProfile(){return `<div class="eyebrow">PROFIL SISWA</div><h1 class="h1">Pengaturan profil</h1><p class="subtitle">Profil contoh untuk menunjukkan tampilan akun online. Autentikasi sungguhan belum terhubung pada file HTML ini.</p><div class="card pad" style="max-width:750px;margin-top:18px"><div class="row align-center" style="margin-bottom:17px"><div class="avatar" style="width:62px;height:62px;font-size:21px">${initials(state.profile.name)}</div><div><h3 class="card-title">${esc(state.profile.name)}</h3><p class="small muted">${esc(state.profile.email)}</p><span class="badge badge-orange">Akun demo lokal</span></div></div><div class="form-grid"><div class="field full"><label>Nama</label><input id="profilePageName" value="${esc(state.profile.name)}"></div><div class="field"><label>Email contoh</label><input id="profilePageEmail" value="${esc(state.profile.email)}"></div><div class="field"><label>Sekolah</label><input id="profilePageSchool" value="${esc(state.profile.school)}"></div></div><div class="work-actions"><span class="tiny muted">Data disimpan ke localStorage pada browser.</span><button class="btn btn-primary" onclick="saveProfilePage()">Simpan profil</button></div><div class="divider"></div><h3 class="card-title">Data dan privasi demo</h3><p class="small muted">Jangan gunakan data pribadi sensitif untuk presentasi. Untuk menghapus seluruh progres demo dari perangkat ini, gunakan tombol di bawah.</p><button class="btn btn-danger" onclick="clearDemoData()">Hapus data demo dari browser ini</button></div>${footer()}`}
function saveProfilePage(){state.profile.name=document.getElementById('profilePageName').value.trim()||'Siswa Demo';state.profile.email=document.getElementById('profilePageEmail').value.trim();state.profile.school=document.getElementById('profilePageSchool').value.trim();persist();render();toast('Profil demo disimpan.')}
function clearDemoData(){document.getElementById('modalRoot').innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><div class="modal"><h2>Hapus semua data demo?</h2><p>Trial, jawaban, refleksi, points, dan profil yang disimpan pada browser ini akan direset.</p><div class="modal-actions"><button class="btn btn-plain" onclick="closeModal()">Batal</button><button class="btn btn-danger" onclick="localStorage.removeItem('cobain_v3_state');state=JSON.parse(JSON.stringify(defaultState));closeModal();currentPage='home';render();toast('Data demo di-reset.')">Ya, hapus</button></div></div></div>`}
function printCertificate(id){const c=getCareer(id),t=getTrial(id);if(!t?.complete){toast('Sertifikat demo tersedia setelah trial diselesaikan.');return}const name=esc(state.profile.name);const html=`<!doctype html><html><head><meta charset="utf-8"><title>Certificate of Completion - COBAIN</title><style>body{font-family:Arial,sans-serif;margin:0;padding:32px;background:#f3f5f9;color:#102b58}.cert{background:white;border:10px solid #102b58;outline:2px solid #ff981f;outline-offset:-20px;max-width:900px;margin:0 auto;padding:55px;text-align:center;min-height:580px;display:flex;flex-direction:column;justify-content:center}.logo{height:54px;object-fit:contain;margin:0 auto 24px}.small{letter-spacing:3px;font-size:12px;color:#55708f}.title{font-size:38px;margin:12px 0;color:#102b58}.name{font-size:32px;border-bottom:1px solid #ccd5e4;display:inline-block;padding:10px 50px;margin:12px 0}.role{font-weight:bold;color:#2670e8;font-size:22px}.desc{max-width:650px;line-height:1.6;margin:10px auto 25px;color:#52627a}.foot{display:flex;justify-content:space-between;margin-top:32px;font-size:11px;color:#65738a}.stamp{font-size:10px;border:1px solid #b8c8e2;border-radius:20px;display:inline-block;padding:7px 13px;margin:0 auto 15px}@media print{body{background:white;padding:0}.cert{max-width:none;min-height:95vh;border:10px solid #102b58;page-break-inside:avoid}}</style></head><body><div class="cert"><img class="logo" src="${LOGO_WORD}"><div class="small">CERTIFICATE OF COMPLETION</div><div class="title">Career Trial Completed</div><div>Diberikan kepada</div><div class="name">${name}</div><div class="desc">telah menyelesaikan proyek simulasi edukatif untuk mengenal tahapan kerja dasar, membuat artefak, menerima feedback, melakukan revisi, dan merefleksikan pengalaman.</div><div class="role">${esc(c.title)}</div><div class="desc">Peran simulasi: ${esc(c.display_role)} · Diselesaikan ${dateFmt(t.completedAt)}</div><div class="stamp">BUKAN SERTIFIKASI KOMPETENSI PROFESI</div><div class="foot"><div>COBAIN · Eksplorasi Karier</div><div>Dokumen simulasi · ID: ${id.toUpperCase()}-${new Date(t.completedAt).getTime().toString(36).toUpperCase()}</div></div></div><script>window.onload=()=>setTimeout(()=>window.print(),350)<\/script></body></html>`;const w=window.open('','_blank');if(!w){toast('Browser memblokir jendela cetak. Izinkan pop-up untuk file ini atau gunakan browser lain.');return}w.document.write(html);w.document.close()}
function renderMyTrialsSafe(){return renderMyTrials()}
document.addEventListener('input',e=>{const el=e.target;if(el.matches('[data-answer]')){const t=getTrial();if(!t)return;let val=el.type==='checkbox'?el.checked:el.value;t.answers[el.dataset.answer]=val;persist();if(el.dataset.answer==='budget'){const b=document.getElementById('budgetAlert');if(b){const n=Number(val);b.innerHTML=n>3000000?`<span style="color:var(--red);font-weight:800">Anggaran melewati batas ${money(3000000)}.</span> Sesuaikan sebelum lanjut.`:`Batas anggaran awal: Rp3.000.000. Setelah tahap masukan klien, batas akan berubah menjadi Rp2.400.000.`}}}});
document.addEventListener('change',e=>{const el=e.target;if(el.matches('[data-answer]')){const t=getTrial();if(!t)return;t.answers[el.dataset.answer]=el.type==='checkbox'?el.checked:el.value;persist()}});
navBind();render();
</script>
</body></html>
