,"kind":"Panduan praktik platform / analitik","url":"https://blog.youtube/creator-and-artist-stories/master-these-4-metrics/","why":"Menjelaskan CTR, retensi penonton, sumber trafik, dan konten yang menarik audiens baru; dipakai untuk memahami metrik konten, bukan menggeneralisasi semua kampanye."},"M5":{"title":"Marketing Management","publisher":"Pearson; Kotler, Keller, Chernev","kind":"Buku teks","url":"https://www.pearson.com/en-us/schools/subject-catalog/p/marketing-management/P200000015427","why":"Referensi teori pemasaran seperti target pasar, positioning, komunikasi, dan pengelolaan pemasaran."},"U1":{"title":"SKKNI Bidang Desain Grafis dan Desain Komunikasi Visual - Kepmenaker No. 126 Tahun 2023","publisher":"Kementerian Ketenagakerjaan RI / JDIH Kemnaker","kind":"Standar resmi Indonesia (berdekatan dengan UX, bukan standar UX penuh)","url":"https://jdih.kemnaker.go.id/peraturan/detail/2852/keputusan-menteri-nomor-126-tahun-2023","why":"Memuat kompetensi desain, komposisi visual, project/design brief, proses dan produksi desain, serta perlindungan kekayaan intelektual."},"U2":{"title":"Web and Digital Interface Designers (15-1255.00)","publisher":"O*NET OnLine / U.S. Department of Labor-sponsored occupational database","kind":"Profil pekerjaan berbasis data okupasi","url":"https://www.onetonline.org/link/summary/15-1255.00","why":"Menjelaskan tugas seperti riset pengguna, pembuatan dan pengujian desain, koreksi berdasar feedback, prototipe, serta aksesibilitas dan kompatibilitas perangkat."},"U3":{"title":"What are UX Roles?","publisher":"Interaction Design Foundation (IxDF)","kind":"Lembaga pembelajaran profesional UX","url":"https://assets.interaction-design.org/literature/topics/ux-roles","why":"Menerangkan aktivitas riset pengguna, menemukan pain point, ideasi, prototyping, usability testing, dan contoh deliverables."},"U4":{"title":"Paper Prototyping: How to Create & Usability-Test Simple UI Prototypes","publisher":"Nielsen Norman Group (NN/g), video tutorial 40 menit","kind":"Video demonstrasi praktisi","url":"https://www.nngroup.com/videos/paper-prototyping-tutorial/","why":"Demonstrasi prototipe low-fidelity dan uji kegunaan; narasumber memiliki pengalaman UX lebih dari 20 tahun. Contoh video bertanggal 2011 sehingga konsep dasarnya berguna, tetapi cek praktik/tool terkini."},"U5":{"title":"A Project Guide to UX Design, 3rd Edition","publisher":"Pearson","kind":"Buku / referensi desain proyek UX","url":"https://www.pearson.com/en-us/subject-catalog/p/a-project-guide-to-ux-for-user-experience-designers-in-the-field-or-in-the-making/P200000010474/9780138188221","why":"Membahas discovery, riset pengguna, persona, journey map, wireframe, prototipe, pengujian dan kolaborasi."},"D1":{"title":"SKKNI Bidang Keahlian Artificial Intelligence Subbidang Data Science - Kepmenaker No. 299 Tahun 2020","publisher":"Kementerian Ketenagakerjaan RI / JDIH Kemnaker","kind":"Standar resmi Indonesia (Data Science; bukan spesifik hanya Data Analyst)","url":"https://jdih.kemnaker.go.id/peraturan/detail/1979/keputusan-menaker-nomor-299-tahun-2020","why":"Acuan kompetensi data science. Gunakan unsur yang relevan, seperti objektif bisnis, pengumpulan, telaah, validasi dan pembersihan data; jangan menyebutnya standar eksklusif Data Analyst."},"D2":{"title":"Kurikulum S1 Sains Data 2023-2028","publisher":"Departemen Statistika, Institut Teknologi Sepuluh Nopember (ITS)","kind":"Kurikulum akademik Indonesia","url":"https://www.its.ac.id/statistika/akademik/program-studi/s1-sains-data/kurikulum-2023-2028/","why":"Halaman kurikulum menyebut penyelarasan dengan SKKNI Data Science dan unit kompetensi Data Analyst; cocok sebagai konteks akademik, tetap cek dokumen SKKNI utama."},"D3":{"title":"Study guide for Exam PL-300: Microsoft Power BI Data Analyst","publisher":"Microsoft Learn","kind":"Kerangka keterampilan vendor profesional","url":"https://learn.microsoft.com/en-us/certifications/resources/study-guides/PL-300","why":"Membagi pekerjaan ke menyiapkan data, memodelkan data, memvisualisasikan/menganalisis data, serta mengelola dan mengamankan data. Revisi halaman mencantumkan keterampilan per 20 April 2026."},"D4":{"title":"Google Data Analytics Professional Certificate","publisher":"Google / Coursera","kind":"Program pembelajaran profesional","url":"https://www.coursera.org/professional-certificates/google-data-analytics","why":"Mencakup pertanyaan bisnis, pembersihan dan pengorganisasian data, analisis, visualisasi, komunikasi temuan, dan capstone case study."},"D5":{"title":"Data Analyst Full Project Tutorial: SQL + Excel + Power BI + Tableau (2026)","publisher":"Data Tutorials, YouTube; kanal terverifikasi menurut halaman yang ditinjau","kind":"Video walkthrough praktis (sumber sekunder)","url":"https://www.youtube.com/watch?v=9QB8trNV0Mg","why":"Memberi contoh alur proyek end-to-end. Kanal juga mempromosikan materi berbayar; gunakan untuk ilustrasi workflow saja dan validasi terhadap standar/vendor independen."},"D6":{"title":"Data Scientists (15-2051.00)","publisher":"O*NET OnLine","kind":"Profil okupasi pembanding (lebih luas dari Data Analyst)","url":"https://www.onetonline.org/link/summary/15-2051.00","why":"Mencantumkan analisis/pembersihan data, visualisasi, laporan, rekomendasi, dan identifikasi masalah bisnis. Beberapa tugas Data Scientist lebih maju; jangan memasukkan machine learning ke trial pemula kecuali dipilih sebagai materi lanjutan."},"C1":{"title":"SKKNI Bidang Kehumasan - Kepmenaker No. 32 Tahun 2022 (Lampiran PDF)","publisher":"Kementerian Ketenagakerjaan RI / JDIH Kemnaker","kind":"Standar resmi Indonesia (komunikasi/humas, bukan standar universal content creator)","url":"https://jdih.kemnaker.go.id/asset/data_puu/SKKNI%202022-032.pdf.pdf","why":"Memuat aktivitas komunikasi media digital, menulis/mengedit konten, media sosial, serta analisis dan monitoring media digital dalam konteks kehumasan."},"C2":{"title":"SKKNI Bidang Pemasaran - Kepmenaker No. 124 Tahun 2022 (Lampiran PDF)","publisher":"Kementerian Ketenagakerjaan RI / JDIH Kemendag","kind":"Standar resmi Indonesia","url":"https://jdih.kemendag.go.id/pdf/Regulasi/2022/SKKNI%20Pemasaran%20(Final)-compressed.pdf","why":"Memuat kompetensi menyiapkan konten digital untuk promosi daring dan mengaitkan konten dengan tujuan pemasaran."},"C3":{"title":"Writers and Authors (27-3043.00)","publisher":"O*NET OnLine","kind":"Profil okupasi untuk penulisan naskah/konten","url":"https://www.onetonline.org/link/details/27-3043.00","why":"Mencantumkan menulis naskah/artikel/iklan, merevisi materi, dan mempresentasikan draf kepada klien/penerbit; dipakai sebagai bagian dari pekerjaan kreator, bukan keseluruhan peran kreator."},"C4":{"title":"Stop guessing, start growing: Master these 4 metrics","publisher":"YouTube Team","kind":"Panduan praktik resmi platform","url":"https://blog.youtube/creator-and-artist-stories/master-these-4-metrics/","why":"Menjelaskan CTR, retensi audiens, sumber trafik, dan konten yang menarik audiens baru. Perhatikan tanggal dan perubahan fitur YouTube."},"C5":{"title":"Content Marketing Certification Course","publisher":"HubSpot Academy","kind":"Modul/video pembelajaran profesional","url":"https://academy.hubspot.com/courses/content-marketing","why":"Materi strategi konten, penyusunan, penetapan tujuan, pengukuran performa dan pelaporan hasil."},"C6":{"title":"Creating Helpful, Reliable, People-First Content","publisher":"Google Search Central","kind":"Panduan profesional/editorial","url":"https://developers.google.com/search/docs/fundamentals/creating-helpful-content","why":"Mendorong konten yang bermanfaat bagi audiens, akurat, menunjukkan siapa pembuatnya dan tidak dibuat hanya untuk memanipulasi peringkat."},"C7":{"title":"Social Media Marketing Certification Course","publisher":"HubSpot Academy","kind":"Modul strategi media sosial","url":"https://academy.hubspot.com/courses/social-media","why":"Mencakup strategi sosial, tujuan, perencanaan, kalender, komunitas, metrik, tata kelola dan risiko."},"S1":{"title":"SKKNI Programming and Software Development, Network and Infrastructure, Operation and System Tools - Kepmenaker No. 22 Tahun 2019","publisher":"Kementerian Ketenagakerjaan RI / JDIH Kemnaker","kind":"Standar resmi Indonesia (cakupan luas TIK)","url":"https://jdih.kemnaker.go.id/asset/data_puu/SKKNI_2019-022.pdf","why":"Acuan kompetensi bidang pemrograman dan pengembangan perangkat lunak; lampirannya memuat kompetensi, konteks dan metode asesmen kerja."},"S2":{"title":"Software Developers (15-1252.00)","publisher":"O*NET OnLine","kind":"Profil okupasi berbasis data pekerjaan","url":"https://www.onetonline.org/link/summary/15-1252.00","why":"Menjelaskan analisis kebutuhan, desain, pemrograman, pengujian/validasi, modifikasi untuk memperbaiki error, dokumentasi dan kolaborasi."},"S3":{"title":"Code of Ethics for Software Engineers","publisher":"IEEE Computer Society / ACM Joint Task Force","kind":"Kode etik profesi","url":"https://www.computer.org/education/code-of-ethics","why":"Mendorong praktik analisis, spesifikasi, desain, pengembangan, pengujian dan pemeliharaan yang bertanggung jawab kepada publik."},"S4":{"title":"Introduction to GitHub; About Pull Requests","publisher":"GitHub Skills / GitHub Docs","kind":"Tutorial praktik workflow kolaborasi","url":"https://github.com/skills/introduction-to-github","why":"Latihan dasar repository, branch, commit, pull request; dokumentasi pull request menunjukkan proses review, feedback, revisi dan automated checks. Detail: https://docs.github.com/en/pull-requests/get-started/about-pull-requests"},"S5":{"title":"Software Engineering, 10th Edition","publisher":"Ian Sommerville, Pearson","kind":"Buku teks rekayasa perangkat lunak","url":"https://www.pearson.com/en-us/subject-catalog/p/software-engineering-theory-and-practice/P200000003258/9780137503148","why":"Mencakup proses software, requirements engineering, desain/implementasi, pengujian, evolution, reliability dan security."},"P1":{"title":"Ethical Principles of Psychologists and Code of Conduct","publisher":"American Psychological Association (APA)","kind":"Kode etik profesional","url":"https://www.apa.org/ethics/code/index.aspx","why":"Mencakup integritas, privasi/kerahasiaan, batas kompetensi dan standar riset seperti persetujuan yang diinformasikan."},"P2":{"title":"Approaches to Research - Psychology 2e, Section 2.2","publisher":"OpenStax","kind":"Buku teks terbuka","url":"https://openstax.org/books/psychology-2e/pages/2-2-approaches-to-research","why":"Membahas studi kasus, observasi naturalistik, survei, arsip, eksperimen, serta batas inferensi korelasi dan kausalitas."},"P3":{"title":"Ethics - Psychology 2e, Section 2.4","publisher":"OpenStax","kind":"Buku teks terbuka","url":"https://openstax.org/books/psychology-2e/pages/2-4-ethics","why":"Membahas perlindungan peserta manusia, informed consent dan debriefing dalam riset psikologi."},"P4":{"title":"Psychological Research: Crash Course Psychology #2","publisher":"CrashCourse, YouTube","kind":"Video pengantar akademik populer","url":"https://www.youtube.com/watch?v=hFV71QPvX2I","why":"Pengenalan metode ilmiah, studi kasus, observasi, survei/wawancara, eksperimen dan bias. Materi pengantar; pasangkan dengan OpenStax dan APA."},"P5":{"title":"Clinical and Counseling Psychologists (19-3033.00)","publisher":"O*NET OnLine","kind":"Profil okupasi pembanding / batas peran klinis","url":"https://www.onetonline.org/link/summary/19-3033.00","why":"Menunjukkan bahwa asesmen, diagnosis dan perawatan klinis adalah pekerjaan profesional dengan persiapan ekstensif; dipakai untuk menetapkan batas, bukan sebagai tugas siswa."}},"careers":[{"id":"marketing","title":"Marketing Strategist","display_role":"Junior Digital Marketing Planner","duration":"55 menit","difficulty":"Pemula / guided-to-hybrid","cost_points":80,"purpose":"Siswa mencoba proses dasar merencanakan kampanye pemasaran: memahami tujuan bisnis dan audiens, menilai bukti sederhana, memilih pesan/kanal, menyusun rencana yang realistis, lalu mengukur dan merevisi rencana.","why":"SKKNI pemasaran memberikan dasar unit pemasaran, riset dan pengolahan data serta konten digital; AMA melengkapi siklus strategi, branding, kanal, analitik dan etika. [M1][M2]","scenario":"Brand fiktif “SegarKita” akan meluncurkan minuman baru bagi pelajar/mahasiswa. Siswa menerima tujuan bisnis, ringkasan survei sintetis, ringkasan pesaing, pilihan kanal, batas anggaran simulasi Rp3.000.000, dan jadwal dua minggu. Semua data bisnis/survei adalah data buatan COBAIN, bukan fakta pasar.","inputs":["Brief produk, tujuan kampanye, batasan produk dan jadwal.","Tabel survei pelanggan sintetis, ringkasan 3 pesaing fiktif, dan ringkasan performa konten contoh.","Daftar kanal beserta biaya/karakteristik yang diciptakan untuk kebutuhan simulasi.","Template Campaign Canvas, content calendar, anggaran, dan KPI."],"stages":[{"time":"5 menit","name":"Kenali pekerjaan & baca brief","action":"Pelajari peran junior digital marketing, hasil kerja yang diharapkan, dan ringkasan sumber. Tandai tujuan bisnis serta batasan brief.","evidence":"Tujuan kampanye dan batasan yang diekstrak dari brief."},{"time":"8 menit","name":"Pahami audiens dan bukti","action":"Baca data survei/competitor snapshot sintetis. Pilih 2–3 temuan yang relevan; tandai keterbatasan ukuran dan cakupan data.","evidence":"Audience insight dengan alasan berbasis data, bukan asumsi kosong."},{"time":"8 menit","name":"Tentukan target dan pesan","action":"Pilih segmen utama, rumuskan value proposition dan satu pesan inti. Jelaskan mengapa alternatif lain tidak dipilih.","evidence":"Target audiens, pesan inti dan alasan pilihan."},{"time":"14 menit","name":"Bangun mini campaign plan","action":"Pilih kanal yang masuk akal, rancang 2–3 ide konten, susun kalender sederhana, alokasikan anggaran, dan pilih KPI yang mengukur tujuan.","evidence":"Campaign Canvas, content calendar, anggaran dan KPI."},{"time":"7 menit","name":"Hadapi perubahan klien","action":"AI-klien mengurangi anggaran 20% atau meminta fokus pada kanal berbeda. Siswa mempertahankan atau mengubah bagian rencana dan mencatat trade-off.","evidence":"Versi revisi dengan perubahan serta alasannya."},{"time":"7 menit","name":"Review dan presentasikan","action":"Tinjau rencana bersama AI reviewer berdasarkan rubrik. Siswa menulis ringkasan rekomendasi untuk klien.","evidence":"Ringkasan eksekutif singkat + rekomendasi final."},{"time":"6 menit","name":"Refleksi karier","action":"Refleksikan bagian yang paling menarik/sulit, feedback yang membantu, serta aspek marketing yang ingin dicoba lagi.","evidence":"Refleksi; bukan kesimpulan bakat atau profesi terbaik."}],"deliverables":["Campaign Canvas: tujuan, target, insight, pesan inti, kanal dan alasan.","Content calendar mini (2 minggu simulasi) berisi format, pesan, jadwal dan CTA.","Rencana anggaran dan KPI yang relevan dengan tujuan.","Catatan perubahan klien dan revisi rencana.","Ringkasan rekomendasi dan refleksi siswa."],"workbench":["Brief & sumber di panel kiri","Tabel data pelanggan/pesaing serta bukti insight","Campaign Canvas terstruktur","Content calendar dengan drag/select sederhana","Budget planner dan KPI selector","Panel AI Mentor / Simulated Client / Reviewer","Version history sederhana agar revisi terlihat"],"rubric":[["Tujuan kampanye dan kesesuaian target",20],["Penggunaan bukti audiens/pasar dan alasan keputusan",20],["Kesesuaian pesan, kanal dan ide konten",20],["Kelayakan anggaran dan timeline",20],["KPI, adaptasi terhadap perubahan dan kualitas refleksi",20]],"ai":["Mentor: membantu siswa menafsirkan brief, menjelaskan istilah, dan memberi hint bertingkat.","Klien simulasi: menyampaikan batasan/masukan dari skenario yang sudah ditentukan; tidak mengubah fakta inti secara acak.","Reviewer: memberi feedback hanya berdasarkan artefak dan rubrik, menunjuk bagian yang menjadi bukti.","AI tidak mengklaim data simulasi sebagai riset pasar nyata dan tidak otomatis menyelesaikan seluruh kampanye untuk siswa."],"safety":["Label data pelanggan, biaya dan kompetitor sebagai “data simulasi”.","Kampanye tidak boleh menggunakan klaim kesehatan/lingkungan yang belum dibuktikan atau menargetkan audiens secara manipulatif.","Nilai adalah kualitas artefak di skenario ini, bukan prediksi keberhasilan kerja nyata."],"resources":{"Standar resmi":[["M1","SKKNI Bidang Pemasaran, Kepmenaker 124/2022"]],"Asosiasi/profesional":[["M2","AMA Marketing Competency Model"]],"Praktik/video":[["M3","HubSpot Academy Social Media Marketing - materi video & workbook"],["M4","YouTube Team - metrik konten untuk perencanaan dan evaluasi"]],"Buku/modul":[["M5","Marketing Management - Pearson"]]},"needs_validation":["Pastikan unit dan kriteria SKKNI spesifik untuk kampanye yang dipakai.","Verifikasi tugas dan batas level junior digital marketing dengan praktisi saat fase lapangan.","Uji apakah durasi 55 menit cukup dan apakah template anggaran/KPI dapat dimengerti siswa."]},{"id":"ux","title":"UI/UX Designer","display_role":"Junior UX/UI Designer","duration":"55 menit","difficulty":"Pemula / hybrid","cost_points":80,"purpose":"Siswa mencoba memahami masalah pengguna, menyintesis informasi pengguna, memetakan alur, membuat wireframe awal, menjalankan evaluasi kegunaan terbatas, dan memperbaiki rancangan.","why":"Profil O*NET menyebut riset pengguna, prototipe, pengujian, feedback dan aksesibilitas. IxDF dan NN/g menunjukkan siklus riset-ideasi-prototipe-tes. SKKNI DKV adalah acuan desain visual berdekatan, bukan standar UX yang lengkap. [U1][U2][U3][U4]","scenario":"Sebuah aplikasi fiktif “EventKita” membuat siswa kesulitan mendaftar workshop sekolah. Siswa harus merancang ulang alur pendaftaran pada layar ponsel. COBAIN menyediakan brief, catatan wawancara sintetis, kebutuhan aksesibilitas dasar, dan wireframe kit.","inputs":["Design brief dan kebutuhan bisnis yang jelas.","Tiga hingga lima kutipan pengguna fiktif; diberi label data sintetis.","Kondisi penggunaan (ponsel, jaringan tidak selalu stabil, usia pengguna).","Template problem statement, journey map, user flow, wireframe, dan test script."],"stages":[{"time":"5 menit","name":"Pengenalan profesi & brief","action":"Pelajari peran UX/UI, perbedaan kebutuhan pengguna dan preferensi visual, serta sumber pengenalan.","evidence":"Tujuan produk dan batasan desain."},{"time":"8 menit","name":"Baca bukti pengguna","action":"Kelompokkan kutipan sintetis menjadi kebutuhan/pain points. Bedakan temuan eksplisit dari interpretasi siswa.","evidence":"Tiga insight dengan bukti kutipan."},{"time":"7 menit","name":"Definisikan masalah & alur","action":"Tulis problem statement dan susun langkah utama dari menemukan event sampai mendapatkan konfirmasi pendaftaran.","evidence":"Problem statement dan user flow."},{"time":"15 menit","name":"Rancang wireframe","action":"Susun hingga tiga layar low-fidelity: detail event, form pendaftaran, dan konfirmasi. Prioritaskan urutan informasi, label jelas, error state, dan aksesibilitas.","evidence":"Wireframe tiga layar dan alasan desain."},{"time":"8 menit","name":"Evaluasi kegunaan terbatas","action":"Jalankan dua tugas uji dalam walkthrough berbasis skenario; gunakan feedback yang sudah ditulis dalam paket sebagai “simulated review”, bukan klaim uji dengan pengguna sungguhan.","evidence":"Catatan hambatan dan tingkat keparahan."},{"time":"6 menit","name":"Revisi desain","action":"Klien meminta form tetap mudah digunakan di layar kecil dan pesan error harus lebih jelas. Siswa memperbaiki wireframe dan menjelaskan trade-off.","evidence":"Versi revisi dengan penjelasan."},{"time":"6 menit","name":"Review & refleksi","action":"AI reviewer meninjau bukti yang terlihat dalam wireframe dan feedback. Siswa merefleksikan pengalaman.","evidence":"Ringkasan desain dan refleksi."}],"deliverables":["Problem statement berbasis bukti","User flow pendaftaran","Wireframe low-fidelity 3 layar","Catatan review kegunaan simulasi","Versi revisi + alasan perubahan"],"workbench":["Panel brief, catatan pengguna sintetis dan referensi","Canvas sticky notes / insight cluster","Flow builder dengan node dan panah","Wireframe builder komponen terbatas (heading, input, button, error, progress)","Panel feedback uji skenario yang dilabeli simulasi","Riwayat versi dan catatan keputusan"],"rubric":[["Masalah pengguna dirumuskan berbasis bukti",20],["Alur tugas jelas dan logis",20],["Wireframe mendukung kegunaan dan aksesibilitas dasar",20],["Hambatan dikenali lewat walkthrough secara hati-hati",20],["Revisi dan alasan desain menanggapi feedback",20]],"ai":["Mentor: mengajukan pertanyaan tentang bukti pengguna dan membantu membedakan fakta dengan interpretasi.","Klien simulasi: menjelaskan batasan bisnis atau meminta penyesuaian berdasarkan skenario.","Reviewer: menilai alur, informasi, error state, dan konsistensi; tidak menganggap wireframe estetis sebagai bukti UX yang baik.","AI tidak boleh menyatakan “pengguna sungguhan sudah menguji” jika hanya walkthrough/synthetic feedback."],"safety":["Jangan meminta siswa memasukkan data pribadi nyata dari teman.","Semua kutipan, persona dan feedback pengguna di trial awal harus dinyatakan sintetis.","Aksesibilitas dasar ditinjau sebagai checklist pendidikan, bukan audit formal."],"resources":{"Standar resmi":[["U1","SKKNI Desain Grafis dan DKV, Kepmenaker 126/2023 (acuan terkait, bukan spesifik UX penuh)"]],"Asosiasi/profesional":[["U2","O*NET Web and Digital Interface Designers"],["U3","Interaction Design Foundation - What are UX Roles?"]],"Praktik/video":[["U4","NN/g Paper Prototyping & Usability Testing - video 40 menit"]],"Buku/modul":[["U5","A Project Guide to UX Design, 3rd Edition - Pearson"]]},"needs_validation":["Cocokkan skenario dengan batas peran UX designer vs UI designer.","Review apakah komponen wireframe cukup untuk menggambarkan pekerjaan tanpa terlalu menyerupai kuis.","Validasi istilah, durasi dan rubric lewat praktisi/pengujian pengguna pada tahap lapangan."]},{"id":"data","title":"Data Analyst","display_role":"Junior Data Analyst","duration":"55 menit","difficulty":"Pemula / hybrid","cost_points":90,"purpose":"Siswa mengalami alur kerja data dasar: memahami kebutuhan bisnis, memeriksa kualitas data, melakukan pembersihan dan analisis sederhana, memvisualisasikan temuan, serta menyampaikan rekomendasi beserta batasan.","why":"Microsoft PL-300 membagi kerja ke persiapan data, pemodelan, visualisasi/analisis, dan pengelolaan. Google Data Analytics membahas pertanyaan bisnis, pembersihan, analisis, visualisasi dan komunikasi. SKKNI 299/2020 adalah standar bidang Data Science, sehingga hanya bagian yang relevan dipakai. [D1][D2][D3][D4]","scenario":"Toko alat tulis daring fiktif “KertasKita” melihat nilai penjualan mingguan menurun. Siswa mendapat CSV sintetis berisi tanggal, kategori, kanal, unit, harga, diskon dan omzet. Tujuan: mencari pola yang layak ditindaklanjuti, bukan menebak penyebab tanpa bukti.","inputs":["CSV sintetis 80–150 baris, dengan beberapa duplikat, nilai kosong dan format tanggal tidak konsisten yang disengaja.","Definisi kolom/data dictionary dan pertanyaan bisnis dari stakeholder.","Template pemeriksaan data, tabel ringkasan, chart builder, dan memo insight.","Skenario tambahan: stakeholder bertanya “apakah diskon menyebabkan penurunan?” tanpa data kausal yang cukup."],"stages":[{"time":"5 menit","name":"Kenali peran dan pertanyaan bisnis","action":"Pelajari pengantar Data Analyst, apa itu data quality, dan kebutuhan stakeholder. Ubah brief menjadi pertanyaan analitis yang terukur.","evidence":"Pertanyaan analisis dan ukuran yang diperlukan."},{"time":"8 menit","name":"Pahami dataset","action":"Periksa nama kolom, tipe data, nilai kosong, duplikat dan kesesuaian definisi metrik.","evidence":"Daftar isu kualitas data dan keputusan penanganan."},{"time":"12 menit","name":"Bersihkan dan analisis","action":"Atasi isu yang disengaja dengan langkah yang tercatat, hitung omzet/order count/rata-rata order value atau metrik relevan, lalu bandingkan kategori/kanal/periode.","evidence":"Dataset hasil bersih dan tabel ringkasan."},{"time":"10 menit","name":"Visualisasikan pola","action":"Pilih maksimal dua chart yang sesuai pertanyaan. Beri judul, label, satuan, dan konteks.","evidence":"Chart dengan alasan pemilihan."},{"time":"8 menit","name":"Respons permintaan stakeholder","action":"Stakeholder bertanya apakah diskon menyebabkan penurunan. Siswa menjelaskan apa yang bisa dilihat dari data dan apa yang belum dapat disimpulkan.","evidence":"Insight, caveat, dan kebutuhan analisis lanjutan."},{"time":"6 menit","name":"Susun rekomendasi","action":"Tulis tiga temuan dengan bukti, satu rekomendasi prioritas dan langkah pengukuran berikutnya.","evidence":"One-page analyst memo."},{"time":"6 menit","name":"Review & refleksi","action":"AI reviewer mengecek logika metrik, transparansi pembersihan, chart dan batas klaim.","evidence":"Feedback dan refleksi siswa."}],"deliverables":["Log pembersihan data","Tabel ringkasan metrik","Satu atau dua visualisasi","Memo berisi 3 temuan, rekomendasi dan batasan","Daftar pertanyaan lanjutan yang perlu data tambahan"],"workbench":["Preview CSV dan data dictionary","Spreadsheet-style table dengan sort/filter dan formula dasar","Data quality checklist","Kalkulator metrik ringkasan","Chart builder dengan pilihan grafik terbatas","Memo editor; bagian “yang diketahui” dan “belum dapat disimpulkan”"],"rubric":[["Pertanyaan bisnis dan metrik relevan",20],["Ketelitian mengenali dan menangani kualitas data",20],["Kebenaran perhitungan dan alasan analisis",20],["Visualisasi mudah dibaca dan sesuai pertanyaan",20],["Insight, rekomendasi dan batas kesimpulan dinyatakan jelas",20]],"ai":["Mentor: mengajarkan istilah/rumus dengan hint bertingkat dan menjelaskan kenapa pemeriksaan data diperlukan.","Stakeholder simulasi: meminta insight atau menantang asumsi, tetapi tidak memberikan data baru di luar skenario yang tercatat.","Reviewer: dapat memverifikasi angka pada dataset; jika belum ada perhitungan otomatis yang aman, harus menyebut hasil sebagai draft dan bukan mengarang nilai.","AI harus menekankan bahwa korelasi/pola pada data observasional tidak otomatis membuktikan sebab-akibat."],"safety":["Gunakan data sintetis sepenuhnya; tidak ada data pribadi atau transaksi nyata.","Metrik dan angka yang diberikan pada contoh harus dapat dihitung ulang/diuji otomatis.","Jangan memasukkan machine learning ke versi pemula sebagai syarat utama."],"resources":{"Standar resmi":[["D1","SKKNI Data Science, Kepmenaker 299/2020 - bidang yang berdekatan, bukan standar eksklusif Data Analyst"],["D2","Kurikulum Sains Data ITS 2023-2028"]],"Asosiasi/profesional":[["D3","Microsoft Learn - Power BI Data Analyst study guide"]],"Praktik/video":[["D5","Data Tutorials - walkthrough proyek end-to-end; sumber sekunder dan perlu diverifikasi silang"]],"Buku/modul":[["D4","Google Data Analytics Professional Certificate"]],"Profil okupasi pembanding":[["D6","O*NET Data Scientists - profil terkait, lebih luas dari Data Analyst; gunakan sebagai pembanding saja"]]},"needs_validation":["Audit angka dataset, data dictionary, dan kunci perhitungan secara manual.","Cek kesesuaian level tugas dengan junior data analyst, bukan data scientist.","Pilih satu alat awal (spreadsheet) untuk menjaga beban kognitif; tambah SQL/dashboard lanjutan di level berikutnya."]},{"id":"content","title":"Content Creator","display_role":"Junior Social Content Creator","duration":"50 menit","difficulty":"Pemula / hybrid","cost_points":70,"purpose":"Siswa merancang satu paket konten untuk audiens dan tujuan tertentu: memahami brief, menyusun ide, menulis skrip/storyboard, membuat caption/CTA dan rencana publikasi, lalu merevisi berdasarkan feedback dan metrik simulasi.","why":"SKKNI Kehumasan 2022 dan SKKNI Pemasaran 2022 memberi acuan terkait komunikasi digital, penulisan/pengeditan konten, media sosial, dan tujuan promosi. O*NET untuk Writers and Authors menambahkan pekerjaan menulis, menyunting, dan mempresentasikan draf. YouTube menyediakan metrik untuk memahami performa konten. [C1][C2][C3][C4]","scenario":"Brand fiktif “BawaUlang” meluncurkan kotak makan yang dapat digunakan ulang. Siswa diminta membuat konsep video vertikal 30–45 detik untuk pelajar, dengan satu ponsel dan waktu produksi terbatas. Klaim ramah lingkungan tidak boleh berlebihan atau tanpa bukti.","inputs":["Creative brief, deskripsi produk sintetis, brand voice dan sasaran audiens.","Batasan produksi: satu ponsel, tempat sederhana, tanpa talent berbayar.","Template script, storyboard 5 shot, caption, CTA, kalender konten dan mock analytics.","Metrik contoh CTR/retensi/sumber trafik yang diberi label data simulasi."],"stages":[{"time":"5 menit","name":"Pahami peran dan brief","action":"Pelajari perbedaan content creator dan marketing strategist serta tujuan konten, audiens, kanal dan batasan produksi.","evidence":"Tujuan komunikasi dan audience profile."},{"time":"7 menit","name":"Kembangkan konsep","action":"Buat 2 ide singkat, pilih salah satu berdasarkan kebutuhan audiens dan tujuan brief.","evidence":"Konsep terpilih dan alasan."},{"time":"12 menit","name":"Tulis skrip dan storyboard","action":"Buat hook, pesan utama, urutan 5 shot, voice-over/dialog, teks layar, dan CTA untuk video 30–45 detik.","evidence":"Skrip + storyboard yang dapat dieksekusi."},{"time":"7 menit","name":"Siapkan paket publikasi","action":"Tulis caption, judul/cover concept, tag yang relevan, kalender publikasi satu minggu, dan KPI yang sesuai.","evidence":"Paket publikasi dan rencana metrik."},{"time":"7 menit","name":"Baca performa konten contoh","action":"Baca CTR/retensi/sumber trafik simulasi, lalu tentukan bagian yang layak diperbaiki. Tidak perlu menganggap satu metrik berdiri sendiri.","evidence":"Diagnosis metrik yang berhati-hati."},{"time":"6 menit","name":"Revisi sesuai masukan","action":"Klien membatasi produksi tanpa lokasi khusus dan meminta klaim produk lebih akurat. Siswa menyesuaikan skrip/visual.","evidence":"Versi revisi + catatan perubahan."},{"time":"6 menit","name":"Review & refleksi","action":"AI reviewer menilai kesesuaian brief, kejelasan naskah, akurasi klaim dan kelayakan produksi.","evidence":"Feedback dan refleksi."}],"deliverables":["Creative concept dan rationale","Skrip video 30–45 detik","Storyboard 5 shot","Caption + CTA + konsep cover/thumbnail","Kalender konten mini dan KPI","Revisi final dengan alasan"],"workbench":["Creative brief dan audiens","Editor skrip dengan batas durasi/karakter","Storyboard board 5 panel","Caption/CTA panel","Calendar planner","Mock analytics panel dan reviewer"],"rubric":[["Kesesuaian ide dengan tujuan dan audiens",20],["Kejelasan hook, alur cerita dan pesan",20],["Skrip/storyboard dapat diproduksi dengan sumber daya terbatas",20],["Akurasi klaim, hak cipta dan etika penggunaan aset",20],["Penggunaan metrik, revisi dan alasan perbaikan",20]],"ai":["Mentor: memberi pertanyaan untuk memperjelas audiens, satu pesan inti, nada dan batas produksi.","Klien simulasi: memberikan feedback tentang brief atau sumber daya produksi.","Reviewer: menilai keterkaitan deliverable dengan brief, tidak menilai “viral” sebagai sesuatu yang dapat dijamin.","AI tidak boleh menyarankan klaim produk yang tidak didukung atau menyajikan metrik simulasi sebagai performa real."],"safety":["Semua data performa adalah mock metrics.","Gunakan aset bawaan atau aset berlisensi; jangan mengambil musik/gambar tanpa izin.","Jangan meminta siswa merekam teman/orang lain tanpa persetujuan. Klaim produk harus sesuai brief dan bukti yang disediakan."],"resources":{"Standar resmi":[["C1","SKKNI Kehumasan, Kepmenaker 32/2022 - relevan untuk komunikasi/konten digital, bukan seluruh profesi kreator"],["C2","SKKNI Pemasaran, Kepmenaker 124/2022"]],"Asosiasi/profesional":[["C4","YouTube Team - metrik dan analytics kreator"]],"Praktik/video":[["C5","HubSpot Content Marketing Course - materi dan contoh mengukur konten"]],"Buku/modul":[["C7","HubSpot Social Media Marketing Course"],["C6","Google Search Central - helpful, reliable, people-first content"]]},"needs_validation":["Tentukan batas antara content creator, copywriter dan social media manager di katalog profesi.","Validasi rubrik kreatif agar tidak terlalu mengutamakan selera AI.","Review klaim produk dan skenario hak cipta/izin untuk pelajar."]},{"id":"software","title":"Software Developer","display_role":"Junior Front-End Developer","duration":"60 menit","difficulty":"Pemula; sediakan guided path","cost_points":100,"purpose":"Siswa mengalami sebagian siklus pengembangan perangkat lunak: memahami kebutuhan, mengidentifikasi perilaku salah, membuat perubahan kecil, menjalankan tes, menanggapi hasil tes, serta menjelaskan perubahan.","why":"O*NET menguraikan kebutuhan pengguna, pemrograman, pengujian/validasi, perbaikan error dan dokumentasi. SKKNI 22/2019 menjadi acuan resmi bidang pemrograman/pengembangan perangkat lunak; GitHub Skills menunjukkan workflow branch, commit dan pull request. [S1][S2][S4]","scenario":"Aplikasi event fiktif “EventKita” memiliki form pendaftaran. Bug: form masih menerima email dengan format salah dan tidak memberikan pesan yang membantu. Siswa menerima requirement, potongan kode awal yang kecil, dan test cases yang harus dipenuhi.","inputs":["Requirement/user story dan acceptance criteria sederhana.","Starter code kecil (HTML/JS atau pseudocode di guided path) yang memuat bug terkontrol.","Daftar test cases: input valid, field kosong, email tidak valid, dan submit berulang.","Panel error log/pesan tes terpraset untuk prototype non-eksekusi; lingkungan eksekusi terisolasi baru diperlukan untuk versi nyata."],"stages":[{"time":"5 menit","name":"Kenali peran dan spesifikasi","action":"Pelajari pekerjaan developer, requirement, bug dan test case. Ubah brief menjadi acceptance criteria.","evidence":"Daftar kriteria keberhasilan fitur."},{"time":"8 menit","name":"Telusuri bug","action":"Baca starter code dan test cases; identifikasi input yang membuat sistem gagal serta kemungkinan penyebab.","evidence":"Hipotesis bug dengan bagian kode/bukti."},{"time":"15 menit","name":"Implementasikan perbaikan","action":"Ubah kode atau logika untuk validasi form dan pesan error. Mode pemula menyediakan hint; mode tantangan mengizinkan siswa menulis lebih mandiri.","evidence":"Patch/perubahan kode dan ringkasan logika."},{"time":"10 menit","name":"Jalankan tes","action":"Uji input valid, kosong, email salah, dan perilaku keyboard/mobile yang relevan. Jika suatu tes gagal, perbaiki dan jalankan kembali.","evidence":"Hasil test case dan bug yang diperbaiki."},{"time":"8 menit","name":"Tanggapi feedback","action":"Reviewer memberi komentar pada perubahan atau test yang belum cukup. Siswa merevisi satu bagian dan mencatat alasannya.","evidence":"Perubahan versi kedua dan alasan."},{"time":"7 menit","name":"Dokumentasikan perubahan","action":"Tulis ringkasan perubahan, cara menguji, keterbatasan dan satu langkah berikutnya seperti commit/PR summary.","evidence":"Change log / README singkat."},{"time":"7 menit","name":"Review & refleksi","action":"AI reviewer memeriksa acceptance criteria dan hasil tes yang benar-benar tersedia.","evidence":"Feedback dan refleksi."}],"deliverables":["Acceptance criteria","Perubahan kode kecil (atau pseudocode pada mode guided)","Test plan dan hasil tiap skenario","Ringkasan bug/solusi","README atau pull-request-style summary"],"workbench":["Requirement panel","Code editor dengan starter code dan mode guided","Runner sandbox aman (fase produksi) atau fixed simulated test output (prototype awal)","Test-case checklist","Diff/version history","Review comments dan change summary"],"rubric":[["Requirement dipahami dan acceptance criteria jelas",15],["Perbaikan kode sesuai kebutuhan",25],["Tes mencakup normal dan edge cases",25],["Perubahan mudah dipahami serta tidak menambah risiko jelas",20],["Dokumentasi, respons terhadap feedback dan refleksi",15]],"ai":["Mentor: dapat menjelaskan konsep, menunjukkan lokasi yang perlu diperiksa dan memberi hint bertahap.","Reviewer: menunjuk line/logic spesifik, membedakan bug yang teramati dari dugaan, dan menggunakan test cases sebagai bukti.","AI tidak boleh mengklaim kode berhasil dijalankan jika prototype hanya menampilkan simulasi hasil tes.","Jika runner real dipakai nanti, jalankan kode di sandbox terisolasi dengan limit resource dan tanpa akses rahasia/network kecuali dirancang aman."],"safety":["Jangan mengeksekusi kode siswa di server produksi atau dengan akses ke sistem internal.","Gunakan contoh kode lokal yang tidak meminta API key, password atau data pribadi.","Sertakan guided path bagi siswa yang belum pernah coding."],"resources":{"Standar resmi":[["S1","SKKNI bidang Programming and Software Development, Kepmenaker 22/2019"]],"Asosiasi/profesional":[["S2","O*NET Software Developers"],["S3","IEEE-CS/ACM Code of Ethics for Software Engineers"]],"Praktik/video":[["S4","GitHub Skills: Introduction to GitHub + pull request workflow"]],"Buku/modul":[["S5","Software Engineering, 10th Edition - Ian Sommerville/Pearson"]]},"needs_validation":["Pastikan starter code cukup sederhana namun tetap mencerminkan alur requirements–implementasi–test–revisi.","Pilih apakah prototype awal memakai test outcome deterministik atau runner kode nyata yang terisolasi.","Jangan memasukkan deployment/secure coding tingkat lanjut sebagai prasyarat di trial pemula."]},{"id":"psych","title":"Psikologi (Eksplorasi)","display_role":"Asisten Riset Psikologi Nonklinis","duration":"50 menit","difficulty":"Pemula / guided","cost_points":80,"purpose":"Siswa mengenal cara kerja psikologi sebagai bidang ilmiah melalui pertanyaan riset perilaku sederhana, data survei sintetis, etika, analisis deskriptif, keterbatasan kesimpulan dan penyusunan ringkasan temuan.","why":"OpenStax menjelaskan metode studi kasus, observasi, survei dan eksperimen serta batas hubungan korelasi-kausalitas. APA menekankan integritas, kerahasiaan, persetujuan dan batas kompetensi. Profil O*NET tentang psikolog klinis digunakan untuk membedakan praktik klinis yang tidak menjadi simulasi siswa. [P1][P2][P3][P5]","scenario":"Tim edukasi fiktif ingin memahami preferensi belajar siswa untuk merancang materi belajar yang lebih jelas. Siswa menjadi asisten riset nonklinis dan memeriksa data survei sintetis anonim berisi metode belajar yang disukai dan persepsi kemudahan belajar. Ini bukan evaluasi kesehatan mental atau diagnosis individu.","inputs":["Pertanyaan riset dan batasan populasi/skenario.","Dataset sintetis anonim kecil (tanpa nama, kontak, diagnosis atau cerita trauma).","Ringkasan definisi variabel, persetujuan partisipasi sebagai konsep, serta checklist etik.","Template tabel deskriptif, coding jawaban pendek dan research memo."],"stages":[{"time":"5 menit","name":"Kenali psikologi dan batas peran","action":"Pelajari psikologi sebagai ilmu tentang perilaku/proses mental dan bedakan riset nonklinis dari diagnosis/konseling profesional.","evidence":"Pernyataan ruang lingkup yang jelas."},{"time":"7 menit","name":"Rumuskan pertanyaan riset","action":"Ubah brief menjadi pertanyaan yang dapat dijawab oleh data tersedia; pilih variabel yang relevan.","evidence":"Research question dan variabel."},{"time":"8 menit","name":"Tinjau metode dan etika","action":"Pilih pendekatan deskriptif yang sesuai. Tandai data apa yang tidak perlu dikumpulkan dan bagaimana privasi/partisipasi harus dijaga.","evidence":"Metode + ethical checklist."},{"time":"12 menit","name":"Analisis data sintetis","action":"Hitung frekuensi/persentase sederhana atau kelompokkan jawaban teks ke tema. Tulis apa yang terlihat dan apa yang tidak bisa disimpulkan.","evidence":"Tabel ringkasan dan kategori tema."},{"time":"8 menit","name":"Buat research memo","action":"Tulis ringkasan 3 temuan, keterbatasan sampel/sumber, dan rekomendasi pendidikan umum yang proporsional.","evidence":"Memo riset 1 halaman."},{"time":"5 menit","name":"Tinjau dilema etika","action":"Skenario klien meminta identitas responden atau meminta kesimpulan “siapa yang bermasalah”. Siswa menjelaskan mengapa permintaan itu tidak sesuai dengan ruang lingkup/data.","evidence":"Respons etis dan batas interpretasi."},{"time":"5 menit","name":"Review & refleksi","action":"AI reviewer mengecek perbedaan data, interpretasi, dan rekomendasi. Siswa merefleksikan pekerjaan riset psikologi.","evidence":"Feedback dan refleksi."}],"deliverables":["Pertanyaan riset dan alasan metode","Ethical checklist","Tabel deskriptif/kategori tema","Research memo: temuan, keterbatasan, rekomendasi","Penjelasan batas etika dan privasi"],"workbench":["Pengenalan psikologi dan sumber bacaan","Research-question builder","Preview data sintetis anonim","Tabel frekuensi / tema","Template memo dengan kolom fakta, interpretasi dan batasan","Panel etik/batas profesional"],"rubric":[["Pertanyaan dan metode cocok dengan data",20],["Analisis teliti dan membedakan data dari interpretasi",20],["Kesimpulan tidak melampaui bukti",20],["Privasi, persetujuan dan batas profesi dipahami",20],["Memo jelas, seimbang dan dapat ditelusuri",20]],"ai":["Mentor: menjelaskan konsep metode riset umum, mengajukan pertanyaan netral, dan membantu memisahkan fakta dari interpretasi.","Reviewer: mengecek apakah kesimpulan sesuai data dan apakah korelasi dibedakan dari sebab-akibat.","AI tidak melakukan diagnosis, tidak membuat profil kesehatan mental individu, tidak memberikan terapi dan tidak menganggap data fiktif sebagai data siswa sungguhan.","Jika cerita sensitif muncul dari pengguna, alihkan ke dukungan orang dewasa tepercaya/profesional dan hentikan analisis diagnosis."],"safety":["Rekomendasi kuat: ubah label katalog dari “Psikolog” menjadi “Eksplorasi Psikologi: Asisten Riset Nonklinis”.","Skenario, responden dan data harus fiktif/sintetis; tidak boleh meminta siswa membuka masalah mental pribadi atau mengevaluasi teman.","Trial ini tidak menyiapkan siswa untuk melakukan pekerjaan psikolog; praktik klinis memerlukan pendidikan, kompetensi dan otorisasi yang sesuai."],"resources":{"Standar resmi":[["P5","O*NET Clinical and Counseling Psychologists - hanya untuk memahami ruang lingkup/batas; bukan template tugas siswa"]],"Asosiasi/profesional":[["P1","APA Ethical Principles of Psychologists and Code of Conduct"]],"Praktik/video":[["P4","Crash Course Psychology #2: Psychological Research - video pengantar metode riset"]],"Buku/modul":[["P2","OpenStax Psychology 2e - Approaches to Research"],["P3","OpenStax Psychology 2e - Ethics"]]},"needs_validation":["Wajib tinjau etika dan batas profesional dengan ahli psikologi sebelum trial diterbitkan luas.","Hindari isi yang secara tersirat menyerupai diagnosis, terapi, atau rekomendasi kesehatan individu.","Uji apakah siswa memahami perbedaan data, interpretasi dan sebab-akibat."]}],"platform_rules":{"research_to_simulation_traceability":"Setiap aktivitas mempunyai source IDs dan catatan bagaimana sumber menginformasikan desain; tugas skenario, data sintetis, waktu, rubrik dan perubahan klien adalah rancangan COBAIN.","reference_library":"Setiap layar Pengenalan Profesi memuat ringkasan 3-5 menit, aktivitas utama, hasil kerja, 3-5 sumber yang dapat diklik, jenis sumber, tanggal/versi yang dicek, dan penjelasan bagian sumber yang dipakai.","AI_mentor":"Hint bertingkat; fixed scenario state; feedback berbasis artefak; tidak membuat hasil bagi siswa secara penuh; menyebut keterbatasan; tidak mengarang sumber.","work_sample_not_quiz":"Siswa menghasilkan deliverable konkret, menghadapi feedback/perubahan, merevisi, dan merefleksikan proses.","safety":"Data sintetis; minimisasi data; usia sesuai; tidak ada pembayaran yang mempengaruhi nilai; psychology trial nonclinical only."}};

let currentPage='home',currentCareer='marketing',careerTab='overview',libraryFilter='all',libraryQuery='',modalCareer=null;

let state=loadState();
function loadState(){try{const v=JSON.parse(localStorage.getItem('cobain_v3_state'));return v?{...defaultState,...v,profile:{...defaultState.profile,...v.profile},trials:v.trials||{},transactions:v.transactions||[]}:structuredClone(defaultState)}catch(e){return JSON.parse(JSON.stringify(defaultState))}}
function persist(){try{localStorage.setItem('cobain_v3_state',JSON.stringify(state))}catch(e){};syncUserBits()}
function syncUserBits(){const n=state.profile.name||'Siswa Demo';const pts=state.points;['sideBalance','navPoints'].forEach(id=>{const el=document.getElementById(id);if(el)el.textContent=pts.toLocaleString('id-ID')});['sideName','topName'].forEach(id=>{const el=document.getElementById(id);if(el)el.textContent=n});['sideAvatar','topAvatar'].forEach(id=>{const el=document.getElementById(id);if(el)el.textContent=initials(n)})}
function initials(s){return (s||'S').trim().split(/\s+/).slice(0,2).map(x=>x[0]||'').join('').toUpperCase()}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function money(n){return 'Rp'+Math.round(Number(n)||0).toLocaleString('id-ID')}
function dateFmt(s){try{return new Date(s).toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'})}catch(e){return '-'}}
function getCareer(id=currentCareer){return CAREERS.find(c=>c.id===id)}
function getMeta(id=currentCareer){return CAREER_META[id]}
function getTrial(id=currentCareer){return state.trials[id]||null}
function ensureTrial(id=currentCareer){if(!state.trials[id])state.trials[id]={careerId:id,stage:0,answers:{},completedStages:[],chat:[],clientChange:false,feedback:null,complete:false,startedAt:new Date().toISOString()};return state.trials[id]}
function answer(name){const t=getTrial();return t?.answers?.[name]??''}
function navigate(page){currentPage=page;document.getElementById('sidebar').classList.remove('open');render()}
function setCareer(id){currentCareer=id;careerTab='overview';navigate('career')}
function toggleSidebar(){document.getElementById('sidebar').classList.toggle('open')}
function toast(msg){const wrap=document.getElementById('toastWrap'),d=document.createElement('div');d.className='toast';d.textContent=msg;wrap.appendChild(d);setTimeout(()=>d.remove(),3300)}
function openProfileModal(){document.getElementById('modalRoot').innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><div class="modal"><h2>Profil siswa demo</h2><p>Profil ini hanya tersimpan di browser perangkat ini. Belum ada akun atau autentikasi online.</p><div class="form-grid"><div class="field full"><label>Nama yang ditampilkan</label><input id="profileName" value="${esc(state.profile.name)}" placeholder="Nama siswa"></div><div class="field full"><label>Email contoh</label><input id="profileEmail" value="${esc(state.profile.email)}" placeholder="email@contoh.id"></div><div class="field full"><label>Sekolah (opsional)</label><input id="profileSchool" value="${esc(state.profile.school)}" placeholder="Nama sekolah"></div></div><div class="callout blue" style="margin-top:13px">Untuk presentasi, kamu bisa mengganti nama agar Career Passport terlihat personal. Form ini bukan login sungguhan.</div><div class="modal-actions"><button class="btn btn-plain" onclick="closeModal()">Batal</button><button class="btn btn-primary" onclick="saveProfile()">Simpan profil demo</button></div></div></div>`}
function saveProfile(){state.profile.name=document.getElementById('profileName').value.trim()||'Siswa Demo';state.profile.email=document.getElementById('profileEmail').value.trim();state.profile.school=document.getElementById('profileSchool').value.trim();persist();closeModal();render();toast('Profil demo tersimpan di browser.')}
function closeModal(){document.getElementById('modalRoot').innerHTML=''}
function doGlobalSearch(q){if(!q.trim())return;navigate('explore');const el=document.getElementById('careerSearch');if(el){el.value=q;renderCareerGrid(q)}else{libraryQuery=q;navigate('library')}}
function navBind(){document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>navigate(b.dataset.page)));}
function render(){syncUserBits();document.querySelectorAll('#sideNav [data-page],.mobile-nav [data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===currentPage||(currentPage==='career'&&b.dataset.page==='explore')||(currentPage==='trial'&&b.dataset.page==='mytrials')||(currentPage==='results'&&b.dataset.page==='passport')));let el=document.getElementById('page');if(!el)return;
 const pages={home:renderHome,explore:renderExplore,career:renderCareerDetail,trial:renderTrial,mytrials:renderMyTrials,library:renderLibrary,passport:renderPassport,points:renderPoints,profile:renderProfile,results:renderResults};el.innerHTML=(pages[currentPage]||renderHome)();navBind();afterRender()}
function afterRender(){if(currentPage==='trial'){const body=document.getElementById('chatBody');if(body)body.scrollTop=body.scrollHeight;}}
function progress(c){const t=getTrial(c.id);if(!t)return {pct:0,done:false,label:'Belum dimulai'};if(t.complete)return {pct:100,done:true,label:'Selesai'};let n=(t.completedStages||[]).length;return {pct:Math.round(n/7*100),done:false,label:n?`${n}/7 tahap`:'Sedang berjalan'}}
function footer(){return `<div class="footer-note">COBAIN Prototype V3 · Simulasi edukatif berbasis sumber publik · Data kerja dalam skenario ini adalah contoh sintetis.</div>`}
